  <text text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a"><tspan x="116" y="206.0">6.1 단·장기 토양</tspan><tspan x="116" y="224.0">유기물 분해 모델의</tspan><tspan x="116" y="242.0">주요 성과 및 한계</tspan></text>
  <line x1="198" y1="208" x2="222" y2="208" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="222" y="128" width="164" height="158" rx="10" fill="#dcfce7" stroke="#334155" stroke-width="1.4"/>
