  <text text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a"><tspan x="680" y="206.0">6.4 국가 토양</tspan><tspan x="680" y="224.0">탄소 인벤토리 보고</tspan><tspan x="680" y="242.0">체계(Tier 3)</tspan></text>
  <text x="400" y="348" text-anchor="middle" font-size="11" fill="#64748b">실사진/도해 생성 프롬프트 준비됨 (fal.ai 또는 나노바나나 API 키 활성화 시 실사 PNG 자동 대체)</text>
