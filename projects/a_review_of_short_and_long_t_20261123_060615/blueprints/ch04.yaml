chapter_id: ch04
chapter_number: 4
title: 제4장. 차세대 단기 및 명시적 미생물 분해 모델의 수리적 메커니즘 (Short-Term & Microbial-Explicit Models)
target_pages: 15
summary_ko: 본 단원에서는 시간 단위부터 연간 변동을 모의하는 기질-미생물 효소 결합 단기 모델과 미생물 탄소이용효율(CUE)을 명시적으로 반영한 모델(BAMS1, MIMICS 등)의 수리 구조를 규명한다. 환경 스트레스 요인(UV-B 복사, 건습
  반복)과 프라이밍 효과가 미생물 생체량 및 단기 유기물 분해 플럭스에 미치는 비선형적 영향을 정량화한다.
sections:
- 4.1 미카엘리스-멘텐 및 역미카엘리스-멘텐 기반 효소 반응속도론 수리화
- 4.2 미생물 탄소이용효율(CUE)의 가변성과 바이오매스 사멸체의 광물 흡착 모델링
- '4.3 다상·다성분·연직 다층 모델(BAMS1)의 유효성: 급속 분해성 유기물의 장기 잔류 현상 규명'
- 4.4 단기 환경 변동성(UV-B 복사 노출, 건습 반복, 동결 융해)에 따른 분해 가속 반응 모의
