chapter_id: ch01
chapter_number: 1
title: '제1장. 국문·영문 초록 및 서론: 토양 유기물 분해 모델링의 학술적 배경과 패러다임 전환 (Abstract & Introduction)'
target_pages: 15
summary_ko: 본 단원에서는 토양 유기물의 생지화학적 순환과 기후변화 완화 기능의 중요성을 조명하고, 고전적 부식화 패러다임에서 미생물 연속체 및 물리화학적 보호 기작으로 전환된 최신 학술적 흐름을 소개한다. 특히 단기 탄소 플럭스 추정과 장기 탄소
  저장량 예측 간의 시공간적 불일치 문제를 해결하기 위한 수리적 모델링의 필요성과 본 리뷰의 연구 범위를 정립한다.
sections:
- 1.1 국문 및 영문 초록, 주제별 핵심 학술 키워드 (Abstract & Keywords)
- 1.2 전 지구 탄소 순환에서 토양 유기탄소(SOC)의 위상과 분해 역학의 중요성
- 1.3 고전적 부식화 개념에서 미생물 연속체(Microbial Continuum) 패러다임으로의 전환
- 1.4 장기 기후변화 예측과 단기 농경지 관리 간의 시공간적 스케일 간극 및 모델링의 필요성
