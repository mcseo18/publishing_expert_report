book_metadata:
  title_ko: 토양 유기물 분해에 관한 장단기 모델 리뷰
  title_en: A Review of Short- and Long-Term Models for Soil Organic Matter Decomposition
  target_audience: 국내외 학회지 심사위원, 대학교수, 농학·생명과학 연구자
  book_summary_ko: 본 논문은 농경지 및 산림 생태계에서 토양 유기물(SOM) 분해 역학을 모의하는 단기(생물계절 및 연간 미생물 반응) 및 장기(수십~수백 년 단위 탄소 격리 및 부식화) 동적 모델을 체계적으로 비교·분석한 종합 고찰 연구이다.
    1차 반응속도론 기반의 고전적 구획 모델(RothC, Century)부터 미생물 효소 반응론 및 물리화학적 광물 결합 기작을 반영한 차세대 명시적 모델(MIMICS, Millennial, BAMS1, SoilR)에 이르는 수리적 지배방정식과 매개변수화
    체계를 심도 있게 검토하였다. 기후변화 시나리오 하에서 토양 탄소 중립 및 온실가스 배출 저감 예측의 불확실성을 완화하기 위한 토양 탄소 동태 모델의 정량적 평가 기준과 다중 스케일 통합 프레임워크를 제시한다.
  target_pages: 90
  target_total_pages: 90
