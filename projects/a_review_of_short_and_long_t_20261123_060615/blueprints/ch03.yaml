chapter_id: ch03
chapter_number: 3
title: 제3장. 고전적 장기 분해 구획 모델의 수리적 메커니즘과 정량적 거동 (Long-Term Compartmental Models)
target_pages: 15
summary_ko: 본 단원에서는 RothC 및 Century 모델로 대표되는 장기 구획 모델의 선형 미분방정식 체계와 불활성/난분해성 유기물 분할 기준을 정량적으로 분석한다. 수십 년 이상의 장기 연대 방사성 탄소(14C) 추적 자료 및 현장 실측치와의
  비교를 통해 장기 체류 시간 모의의 강점과 환경 민감도 함수(수분·온도 계수)의 한계를 검토한다.
sections:
- 3.1 1차 감쇄 속도론 기반의 장기 구획 모델 지배방정식 수립 및 정상상태 해석
- 3.2 RothC 및 Century 모델의 탄소 분획 구성(DPM, RPM, BIO, HUM, IOM) 및 플럭스 전이율
- 3.3 토양 방사성 동위원소(14C) 동태 분석 및 SoilR을 활용한 회전 시간(Turnover Time) 산출
- '3.4 장기 모델의 한계: 물리적 광물 보호 기작 및 유효 공극 구조 반영의 결여'
