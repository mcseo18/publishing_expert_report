chapter_id: ch02
chapter_number: 2
title: '제2장. 체계적 문헌고찰 방법론 및 모델 분류 기준 (Materials & Methods: Literature Scope & Classification)'
target_pages: 15
summary_ko: 본 단원은 PRISMA 가이드라인에 입각하여 지난 40여 년간 KCI, SCI(E) 데이터베이스에 발표된 토양 유기물 분해 모델 연구 논문의 문헌 수집 및 메타 선별 절차를 기술한다. 단기 모델(일~수년, 미생물 바이오매스 중심)과
  장기 모델(수십~수천 년, 구획 분할 중심)을 구별하는 정량적 매개변수 기준과 지배방정식 유형화 틀을 정립한다.
sections:
- 2.1 문헌 수집 및 메타 분석 선정 프로토콜 (PRISMA 가이드라인 적용)
- 2.2 단기 및 장기 토양 분해 모델의 시공간적 스케일 및 구획(Pool) 분류 체계
- '2.3 수리적 구조에 따른 모델 분류: 1차 반응속도론(Linear) vs. 비선형 미생물 효소 반응론'
- 2.4 모델 불확실성 평가 및 R 패키지(SoilR 등)를 활용한 비교 평가 기준 수립
