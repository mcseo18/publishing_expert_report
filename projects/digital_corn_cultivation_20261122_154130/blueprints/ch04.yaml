chapter_id: ch04
chapter_number: 4
title: 제4장. 옥수수 생육 단계별 발달 생리 및 수관 아키텍처
target_pages: 46
summary_ko: 발아(VE)부터 생리적 성숙기(R6)까지의 V기/R기 표준 단계 판정과 엽령 지수 모델을 정립한다. 수관 상·하부의 직립 엽각 형성과 지주근(Brace root) 발달 메커니즘을 밝혀 수광 효율 및 도복 방지 기준을 제시한다. 영양생장기
  질소 과다에 의한 과번무 오판을 엽면적 지수(LAI)와 수관 투광률로 교정하고 군락 3D 복원 실증을 수행한다.
sections:
- 4.1 옥수수 엽칼라(Leaf Collar) 기준 생육단계(VE~VT, R1~R6)의 발달 생리
- 4.2 군락 소광계수(k), 엽면적 지수(LAI) 및 지주근(Brace root) 역학 기준
- '4.3 농가 관행 오해 교정: 초기 과도한 엽면적 확보(웃자람)와 유효 수량 저하 포장 진단'
- '4.4 현장 실증: 지상 라이다(LiDAR) 및 다분광 드론을 활용한 3D 수관 아키텍처 복원'
tables:
