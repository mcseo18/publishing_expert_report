chapter_id: ch09
chapter_number: 9
title: 제9장. 작물 생육·양분 모델링 및 디지털 트윈 시뮬레이션
target_pages: 46
summary_ko: 기상-토양-유전 매개변수를 결합한 메커니즘 기반 작물 모델(APSIM, DSSAT-CERES-Maize)의 수학적 구조를 해석한다. 유효적산온도, 일사량, 근권 질소 동태의 상호작용 알고리즘을 정립한다. 농가의 단편적 직관에 의존한
  파종일·수확일 결정을 교정하고 이상기상 시나리오별 수량 예측 디지털 트윈을 실증한다.
sections:
- 9.1 작물 생리 메커니즘 모델(APSIM-Maize, CERES-Maize)의 탄소 분배 및 생육 수리엔진
- '9.2 유전모수(Genetic Coefficients: P1, P2, P5, G2, G3) 캘리브레이션 정량 기준'
- '9.3 농가 관행 오해 교정: 단순 과거 평균 기후 기반의 파종일 고정 관행과 위험도 진단'
- '9.4 현장 실증: 기상 빅데이터 연동 포장 단위 디지털 트윈 수량 예측 및 최적 의사결정'
tables:
- table_id: 표 9-1
  title: DSSAT CERES-Maize 모델의 품종 유전모수 정의, 측정 방법 및 표준 입력 범위
  columns:
  - 유전모수 코드
  - 생리적 정의
  - 단위
  - 표준 변이 범위
  - 포장 실측 및 보정 방법
  purpose: 디지털 트윈 모델의 국소 포장 적합화를 위한 품종별 생리 모수 최적화
- table_id: 표 9-2
  title: 가상 기후 시나리오(조기가뭄, 개화기고온)별 모델 예측 감수율과 포장 실측치 비교 검증표
  columns:
  - 기상 시나리오
  - 모델 모의 출사일 오차(RMSE)
  - 수량 예측치(kg/10a)
  - 실측 수량(kg/10a)
  - 수량 예측 정확도(%)
  purpose: 이상기후에 따른 생산 위험도 사전 평가 및 작물 모델 신뢰성 검증
