  - 출아 소요일(일)
  - 출아율(%)
  - 저온 묘마름병 위험도
  purpose: 봄철 안전 파종 한계기 설정 및 저온 장애 회피를 위한 정량 기준 제공
- table_id: 표 3-2
  title: 토양 비옥도 및 지형별 사료용·식용 옥수수 권장 가변 재식밀도 설정표
  columns:
  - 토양 비옥도 등급
  - 예상 수분 보유력
  - 이랑 너비(cm)
  - 주간 거리(cm)
  - 목표 재식본수(주/10a)
  - 기대 종실 수량(kg/10a)
  purpose: 포장 내 마이크로 존별 수량 잠재력을 극대화하기 위한 가변 파종 처방전 수립
