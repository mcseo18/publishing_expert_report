chapter_id: ch10
chapter_number: 10
title: 제10장. 데이터 기반 옥수수 병해충 예찰 및 정밀 방제 공학
target_pages: 46
summary_ko: 조명나방, 열대거세미나방, 깨씨무늬병, 그을음무늬병의 발생 생태와 온도 반응 역학을 규명한다. 스마트 페로몬 트랩 및 분광 영상 기반 경제적 피해 한계 수준(EIL) 기준을 확립한다. 농가에서 관행적으로 행하는 발생 후 무차별 살충제
  살포 관행을 교정하고 드론 가변 국소 살포(VRA) 방제를 실증한다.
sections:
- 10.1 주요 병해충(조명나방, 열대거세미나방, 깨씨무늬병)의 생활환 및 기상 의존 감염 생리
- 10.2 유효적산온도 기반 부화 예측 및 경제적 피해 허용 수준(ET, EIL) 정량 기준
- '10.3 농가 관행 오해 교정: 조명나방 줄기 침입 후 살포하는 무효 방제와 천적 파괴 관행 진단'
- '10.4 현장 실증: 스마트 트랩 IoT 데이터 연동 농업용 드론 야간 정밀 국소 방제'
tables:
- table_id: 표 10-1
  title: 옥수수 핵심 병해충별 최적 발병 환경, 요방제 수준(ET) 및 주요 진단 특성
  columns:
  - 병해충명
  - 호발 기상 조건
  - 가해 부위 및 형태적 특징
  - 경제적 요방제 수준(ET)
  - 추천 방제 적기
  purpose: 피해를 최소화하면서 농약 투입량을 절감하기 위한 방제 결정 가이드
- table_id: 표 10-2
  title: 드론 분광 영상 기반 깨씨무늬병 감염도(Severity Index)와 방제 처방 기준표
  columns:
  - 병해 감염 등급
  - 수관 분광 반사율 편차
  - 예상 엽면적 손실률(%)
  - 드론 방제 처방
  - 방제 회피 시 손실률
  purpose: 원격 분광 센싱을 활용한 살균제 가변 살포 맵 제작 기준
