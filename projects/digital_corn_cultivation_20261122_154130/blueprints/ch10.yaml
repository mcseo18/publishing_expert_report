  title: 농업용 대형 드론이 야간에 조명나방 다발 지역을 정밀 하향 분무 방제하는 포장 현장
  description: RTK 경로를 따라 옥수수 수관 상부 2m 고도에서 정밀 유적을 분사하는 자율비행 드론 실사
