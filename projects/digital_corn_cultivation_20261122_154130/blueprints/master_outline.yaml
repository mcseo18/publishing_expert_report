  - chapter_id: ch08
    chapter_number: 8
    title: 제8장. 옥수수 양분 흡수 동태 및 실시간 데이터 기반 양분 관리
    target_pages: 46
    summary_ko: 질소(N), 인산(P), 칼륨(K)의 단계별 흡수 곡선과 전이(Translocation) 메커니즘을 밝힌다. 엽록소계(SPAD) 및 능동형 광학 캐노피 센서(NDVI, NDRE) 기반 질소 충족 지수(NSI) 기준을 확립한다.
      농가에서 흔히 저지르는 전량 기비 위주 시비와 늦은 추비로 인한 도복 및 환경오염을 교정하고 가변 추비기 실증을 수행한다.
    sections:
    - 8.1 옥수수 N-P-K 체내 전류 생리 및 단계별 양분 흡수 속도 역학
    - 8.2 질소충족지수(NSI 0.90 임계치) 및 다분광 식생지수 정량 기준
