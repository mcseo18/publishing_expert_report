  title: 제1부. 옥수수 기원·생물학적 기초 및 품종 디지털 육종
  summary_ko: 야생종 테오신테로부터 현대 다수성 옥수수로의 진화 기작과 C4 식물 해부생리학을 규명한다. 식용·사료용·가공용 품종의 이화학적 특성과 유효적산온도 기반 생태형 구분을 정량화하며, 무인기 분광 센싱 기반 초고속 표현형체학을 적용한
    스마트 품종 선발 및 농가 오인 품종 배제 프로토콜을 정립한다.
  pages: 92
  chapters:
  - chapter_id: ch01
    chapter_number: 1
