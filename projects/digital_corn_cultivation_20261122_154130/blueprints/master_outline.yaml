- part_number: 4
  title: 제4부. 작물 생육 모델링 및 지능형 병해충·잡초 방제
  summary_ko: APSIM-Maize 및 DSSAT 기반 옥수수 생육 디지털 트윈을 구축하여 수량과 생리 과정을 모의한다. 주요 나비목 해충과 반점병의 발병 기작을 디지털 예찰 모델로 규명한다. 딥러닝 비전 센서 기반 잡초 분별과 농가의 예방적
    전면 제초제 살포 관행을 교정하여 패치별 가변 방제(VRA)를 실증한다.
