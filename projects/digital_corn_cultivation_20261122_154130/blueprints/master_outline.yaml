book_metadata:
  title_ko: '디지털 옥수수 재배학: 데이터 기반 작물생리·정밀재배 및 스마트 농기계 공학'
  title_en: 'Digital Corn Cultivation: Data-Driven Crop Physiology, Precision Agronomy, and Smart Machinery Systems'
  target_audience: 농학·스마트농업 전공 학부 및 대학원생, 농촌진흥기관 농업연구·지도관, 대형 영농법인 및 정밀농업 현장 엔지니어
  book_summary_ko: 본 교재는 옥수수의 작물생리학적 본질과 데이터 기반 정밀재배 기술, 지능형 스마트 농기계 공학을 융합한 최고위 전문 지침서이다. 영농 현장에서 빈번히 발생하는 생리장애 오진과 관행적 재배 오해를 과학적 데이터와 정량 지표로
    교정하고, 포장 단위 실증 사례를 중심에 배치하였다. 총 5부 13개 장으로 구성되어 종자 및 근권 관리부터 생육 모델링, 지능형 수확, 글로벌 곡물 밸류체인까지의 전 과정을 총 600쪽 분량으로 완벽히 다룬다.
