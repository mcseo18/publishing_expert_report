chapter_id: ch01
chapter_number: 1
title: 제1장. 옥수수의 기원, 분류 체계 및 식물학적 형태생리
target_pages: 46
summary_ko: 테오신테(Teosinte)의 분얼 억제 및 이삭 대형화 유전 기작과 C4 크란츠(Kranz) 해부 구조의 광합성 효율을 규명한다. 배유의 아밀로스/아밀로펙틴 비율에 따른 마치종, 경립종, 단옥수수, 찰옥수수의 화학적 품질 기준을 확립한다.
  농가의 품종 오해로 인한 교잡 수분 불량 및 당도 저하 문제를 교정하고 현장 포장 진단 기준을 제시한다.
sections:
- 1.1 테오신테 진화 유전학 및 C4 크란츠(Kranz) 해부생리 원리
- 1.2 배유 조성별 분류군(마치종·단옥수수·찰옥수수)의 이화학적 정량 기준
- '1.3 농가 관행 오해 교정: 단옥수수·찰옥수수 혼작 수분(Xenia) 피해 진단'
- '1.4 현장 실증: 용도별 최적 군락 수광 아키텍처 구축 및 생체 데이터 획득'
tables:
