chapter_id: ch05
chapter_number: 5
title: 제5장. 옥수수 생리장애 진단 및 비생물적 스트레스 반응
target_pages: 46
summary_ko: 개화수염신장간격(ASI) 증대에 따른 수정 장애, 고온 불임, 침수 무산소 호흡, 저온 안토시아닌 발현의 분자생리학적 기작을 밝힌다. 엽온 기반 작물수분스트레스지수(CWSI)와 분광 지표를 통한 비생물적 스트레스 정량 판정 기준을 정립한다.
  농가에서 흔히 병해충으로 오진하는 생리장애를 정확히 감별하고 항스트레스 생리활성제 처방을 실증한다.
sections:
- 5.1 고온·한발에 의한 개화수염신장간격(ASI) 연장 및 침수 에틸렌 축적 메커니즘
- 5.2 작물수분스트레스지수(CWSI) 및 엽록소 형광(Fv/Fm) 정량 판정 기준치
- '5.3 농가 관행 오해 교정: 저온 인산 결핍 자색화 현상과 바이러스병 오진 감별 진단'
- '5.4 현장 실증: 열화상 드론 연동 조기 한발 예찰 및 수분 스트레스 완화제 살포'
tables:
- table_id: 표 5-1
  title: 옥수수 주요 비생물적 스트레스의 가시 증상, 취약 생육기 및 병해충 유사 증상 감별표
  columns:
  - 생리장애 요인
  - 발생 생육기
  - 대표적 잎·줄기·이삭 증상
  - 오진하기 쉬운 병해충
  - 과학적 현장 감별법
  purpose: 불필요한 농약 살포를 방지하고 환경 스트레스에 즉각 대처하기 위한 감별 기준
- table_id: 표 5-2
  title: 엽온 기반 CWSI 지수 범위에 따른 옥수수 기공 전도도 저하율 및 관수 트리거 기준
  columns:
  - CWSI 지수
  - 수관-대기 온도차(Tc-Ta, °C)
  - 기공전도도 감수율(%)
  - 생리적 위험도
  - 처방 대책
  purpose: 열화상 센서를 활용한 정밀 관수 자동 제어 트리거 설정
