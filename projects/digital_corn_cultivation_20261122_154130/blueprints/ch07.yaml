chapter_id: ch07
chapter_number: 7
title: 제7장. 옥수수 수분 생리 및 스마트 정밀 관개 공학
target_pages: 46
summary_ko: 증산과 기공 제어의 증발산(ETc) 메커니즘을 밝히고 토양수분장력(pF)과 FDR 체적수분 센싱 체계를 정립한다. 피벗 및 점적 관개 시스템의 가변관개(VRI) 구역 제어 기준을 설정한다. 농가에서 흔히 행하는 육안 건조 시 관수하는
  지연 관개 관행을 교정하고 기상-토양 연동 자동 관개 알고리즘을 실증한다.
sections:
- 7.1 옥수수 증발산(ETc) 모델(FAO-56 듀얼 챔버 계수) 및 수분 흡수 생리
- 7.2 FDR 체적수분센서 및 토양수분장력(-30~-50kPa 임계치) 정량 기준
- '7.3 농가 관행 오해 교정: 한낮 시들음 발생 후 관수하는 지연 관개 피해 진단'
- '7.4 현장 실증: 센터피벗 가변관개(VRI) 및 지중점적(SDI) 자동 관수 시스템 운용'
tables:
- table_id: 표 7-1
  title: 옥수수 생육단계별 작물계수(Kc), 일일 수분 소모량 및 수분 민감도 지수(Ky)
  columns:
  - 생육 단계
  - 표준 작물계수(Kc)
  - 일평균 물 소모량(mm/일)
  - 수분 스트레스 민감도(Ky)
  - 관수 최우선 순위
  purpose: 한정된 수자원 조건에서 수량 손실을 최소화하는 단계별 정밀 관수 계획 수립
- table_id: 표 7-2
  title: 토성별 옥수수 최적 유효수분 고갈율(MAD) 및 관개 개시 장력 임계치
  columns:
  - 토성 구분
  - 포장용수량(%)
  - 위조점(%)
  - 허용 고갈율(MAD, %)
  - 관개 시작 토양장력(kPa)
  purpose: 토양 센서 기반 자동 관수 밸브 개폐 트리거 설정을 위한 물리적 지표
