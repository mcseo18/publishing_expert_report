chapter_id: ch02
chapter_number: 2
title: 제2장. 옥수수 생태형 분류 및 디지털 초고속 표현형 기반 품종 선발
target_pages: 46
summary_ko: 숙기군별 유효적산온도(GDD) 요구도와 일장 반응 생리를 해석하고 지역별 기후 자원에 최적화된 생태형 분류법을 정립한다. 드론 다분광·LiDAR 센싱 기반 수관 체적, 간장, 식생지수 추출을 통해 내도복성 및 바이오매스를 정량 스크리닝한다.
  농가의 단순 다수성 선호에 따른 등숙 불량 관행을 교정하고 데이터 기반 품종 추천 알고리즘을 실증한다.
sections:
- 2.1 숙기군(조·중·만생종)의 GDD(유효적산온도) 요구도 및 환경 적응 생리
- 2.2 초고속 디지털 표현형(High-Throughput Phenotyping)의 분광·구조 지표 기준
- '2.3 농가 관행 오해 교정: 무상기간 무시한 만생종 무리한 도입과 미숙 이삭 피해 진단'
- '2.4 현장 실증: UAV 다분광 정사영상 기반 우수 품종 선발 및 지역 맞춤형 배치'
