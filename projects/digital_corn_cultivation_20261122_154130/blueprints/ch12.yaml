chapter_id: ch12
chapter_number: 12
title: 제12장. 정밀 수확·가공 후 수확 관리 및 스마트 농기계 작업 체계
target_pages: 46
summary_ko: 블랙레이어(흑층) 출현 생리와 곡실 수분 탈수 역학, 사일리지 발효 품질 화학을 규명한다. 콤바인 질량유량 수량센서 교정 및 RTK-GNSS 연동 자율주행 궤적 제어 기준을 정립한다. 농가에서 흔히 겪는 수확 수분율 오판에 따른 종실
  균열, 건조비용 폭탄 및 사일리지 낙산 부패를 교정하고 무인 수확 편대 작업을 실증한다.
sections:
- 12.1 종실 흑층(Black Layer) 형성 생리, 등숙 완료 판정 및 탈립 손실 역학
- 12.2 콤바인 수량모니터(충격판 질량유량 센서) 캘리브레이션 및 수분 보정 기준
- '12.3 농가 관행 오해 교정: 수확 적기 오판에 따른 건조 에너지 낭비 및 사일리지 낙산 부패 진단'
- '12.4 현장 실증: ISOBUS Class 3 연동 자율주행 콤바인-덤프트레일러 무인 협동 수확 작업'
tables:
- table_id: 표 12-1
  title: 곡실용 및 사료용 옥수수의 최적 수확 시기별 수분율, 물리적 손실률 및 건조 비용 기준
  columns:
  - 수확 용도
  - 적정 수확 수분율(%)
  - 탈립 및 깨짐 손실률(%)
  - 수확 후 건조 소요 열량
  - 사일리지 유기산 품질 등급
  purpose: 수확 작업의 경제성과 가공·저장 품질을 극대화하기 위한 수분율 기준
- table_id: 표 12-2
  title: 스마트 수확 콤바인의 센서 종류별 측정 오차 한계, 보정 주기 및 데이터 표준
  columns:
  - 센서 명칭
  - 측정 원리
  - 허용 오차(%)
  - 필수 보정 주기
  - ISOBUS 파라미터 규격
  purpose: 포장 내 정밀 수량 지도(Yield Map) 작성을 위한 수량 모니터 센서 캘리브레이션 가이드
