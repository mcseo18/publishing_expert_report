chapter_id: ch11
chapter_number: 11
title: 제11장. 지능형 잡초 인식 및 자율선택제초 시스템
target_pages: 46
summary_ko: 바랭이, 명아주, 개비름 등 주요 잡초와의 광·수분·양분 경합 생리와 임계 제초 기간(CPWC)을 규명한다. 엣지 AI 딥러닝 객체 검출(YOLOv8 등) 기반 광엽/화본과 잡초 분별 알고리즘을 구축한다. 농가의 관행적 포장 전면 토양처리제
  남용과 저항성 잡초 유발을 교정하고 노즐별 스팟 살포 및 자율 중경 제초를 실증한다.
sections:
- 11.1 옥수수 군락 내 난방제 잡초의 생육 속도 및 잡초 경합 임계 기간(CPWC) 생리
- 11.2 실시간 비전 딥러닝 기반 잡초 검출 정확도(mAP 0.92 이상) 및 스팟 분무 기준
- '11.3 농가 관행 오해 교정: 동일 계통 제초제 연용에 따른 저항성 잡초 확산 및 약해 포장 진단'
- '11.4 현장 실증: 카메라 연동 스마트 붐스프레이어 국소 살포 및 자율주행 기계적 중경 제초'
tables:
- table_id: 표 11-1
  title: 옥수수 포장 주요 우점 잡초의 발생 생태, 경합 위해도 및 임계 제초 기간(CPWC)
  columns:
  - 잡초 분류군
  - 우점 잡초종
  - 발생 성기
  - 10a당 감수율(%)
  - 임계 제초 생육기(CPWC)
  purpose: 제초제 투입 시기 최적화 및 잡초 경합에 의한 수량 감소 방지 기준
- table_id: 표 11-2
  title: 딥러닝 비전 노즐 살포 시스템과 관행 전면 살포 방식의 방제 효율 및 경제성 비교
  columns:
  - 구분 항목
  - 관행 전면 살포
  - 스마트 딥러닝 스팟 살포
  - 개선율(%)
  - 현장 실증 평가
  purpose: 정밀 제초 시스템 도입에 따른 제초제 절감량 및 토양 환경 보전 효과 입증
