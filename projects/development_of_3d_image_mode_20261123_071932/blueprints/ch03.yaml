summary_ko: 작물 대상 3차원 이미지 모델 개발에 대해 SCI(E) / KCI 등재지 즉시 투고 수준 즉시 투고 수준의 6단계 심층 논리(정량 발견→기작 해석→선행연구 비교·불일치 규명→경계조건·트레이드오프→학술·현장 함의→한계·향후과제)로 5개
