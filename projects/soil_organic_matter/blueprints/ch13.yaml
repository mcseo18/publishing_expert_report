chapter_id: ch13
chapter_number: 13
title: 제13장. 퇴비, 녹비작물(헤어리베치 등), 작물잔사 환원 및 보전농업
target_pages: 32
target_audience: 농학·토양환경학 대학 전공 심화(학부 3~4학년·대학원생), 농업연구사, 토양·비료·탄소중립 모델링 실무 전문가
evidence_packet: data/evidence/ch13_evidence.json
learning_objectives:
- 가축분퇴비 부숙도·비료공정규격과 시용 후 토양 부식산·유기탄소 분획 변화를 정량 평가할 수 있다.
- 헤어리베치·호밀 등 녹비작물 및 깊이거름주기(농사로 탄소중립 실증)가 질소 공급과 탄소축적에 미치는 효과를 설명할 수 있다.
- 무경운·최소경운·피복작물(USDA SARE 4판 사례)의 표층·심층 탄소 재분배와 현장 제약을 분석할 수 있다.
