learning_objectives:
- 53 μm 입자크기 및 밀도 분획을 통한 POM·MAOM 분리 표준 프로토콜을 설계할 수 있다.
- 활성탄소(POXC), 열수추출유기탄소(WEOC), 용존유기물(DOM) 지표의 단기 관리 민감도를 해석할 수 있다.
- 국내 흙토람 토양검정, 미국 Cornell CASH, 유럽 토양건강 지표를 비교·적용할 수 있다.
