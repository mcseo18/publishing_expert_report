chapter_id: ch03
chapter_number: 3
title: 제3장. 부식화(Humification) 이론과 미생물 탄소 펌프(MCP)
target_pages: 36
target_audience: 농학·토양환경학 대학 전공 심화(학부 3~4학년·대학원생), 농업연구사, 토양·비료·탄소중립 모델링 실무 전문가
evidence_packet: data/evidence/ch03_evidence.json
learning_objectives:
- 부식산(HA), 풀빅산(FA), 휴민(Humin)의 화학적·분광학적(HA/FA 비, E4/E6 비, FTIR, 13C-NMR) 특성을 설명할 수
  있다.
- 전통적 고분자 중합 가설과 Lehmann & Kleber 토양 연속체 모델·미생물 탄소 펌프(MCP) 이론의 차이를 비교할 수 있다.
- 미생물 사체(Necromass)와 점토·비정질 산화철/알루미늄 광물 표면 간 결합 메커니즘을 도식화할 수 있다.
