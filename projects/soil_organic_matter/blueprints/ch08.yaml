chapter_id: ch08
chapter_number: 8
title: 제8장. 토양 유기탄소·유기물 정량 및 분광 정성 분석법
target_pages: 34
target_audience: 농학·토양환경학 대학 전공 심화(학부 3~4학년·대학원생), 농업연구사, 토양·비료·탄소중립 모델링 실무 전문가
evidence_packet: data/evidence/ch08_evidence.json
learning_objectives:
- 국립농업과학원 Tyurin법, Walkley-Black 습식산화, 건식연소(Dumas), 강열감량(LOI)의 원리·회수율·오차를 비교할 수 있다.
- 토색판·SPAD 503 등 현장 간이 추정법과 Vis-NIR/MIR·FTIR·13C-NMR 분광 분석의 적용 범위를 판단할 수 있다.
- 탄산염 함유 토양의 무기탄소 제거 전처리 및 Van Bemmelen 계수(1.724 vs 2.0) 보정 절차를 적용할 수 있다.
