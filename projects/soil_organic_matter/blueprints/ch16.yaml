title: 제16장. 기후변화, 토양 탄소격리와 국제 MRV·탄소크레딧 정책(FAO·EU·일본 J-Credit·한국)
target_pages: 32
target_audience: 농학·토양환경학 대학 전공 심화(학부 3~4학년·대학원생), 농업연구사, 토양·비료·탄소중립 모델링 실무 전문가
evidence_packet: data/evidence/ch16_evidence.json
learning_objectives:
- FAO GSOCseq, 프랑스 4 per 1000, EU Soil Strategy(EEA·EJP SOIL), 일본 J-Credit(AG-004)의
  정책 구조와 과학적 제약을 비교할 수 있다.
- IPCC Tier 1~3 국가 온실가스 인벤토리 산정 및 등가토양질량(ESM) 기반 토양탄소 저장량(t C/ha) 계산을 수행할 수 있다.
- 국내 저탄소 농산물 인증 및 자발적 탄소시장 MRV(측정·보고·검증)의 영속성·추가성·누출 쟁점을 분석할 수 있다.
