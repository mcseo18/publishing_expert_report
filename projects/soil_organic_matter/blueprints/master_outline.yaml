# 총 목표 분량: 540페이지 (5부 16개 단원 + 부록)
# =============================================================================

book_metadata:
  title_ko: "토양 유기물학: 원리·동태·질소/탄소모델링·분석·탄소격리·현장관리"
  title_en: "Soil Organic Matter Science: Principles, C-N Dynamics, Decomposition Modeling, Analysis, Carbon Sequestration, and Field Management"
  domain: "토양학·농업환경과학·토양 탄소/질소 생지화학 모델링·기후변화 대응"
  target_total_pages: 540
  target_audience: "농학·토양환경학 대학 전공 심화(학부 3~4학년·대학원생), 농업연구사, 토양·비료·탄소중립 모델링 실무 전문가"
  language: "ko"
  kg_store_root: "C:\\SMC_GRAPHRAG"
  collected_data_root: "E:\\SMC_Report_Platform_Data"
  pilot_chapter: "ch01"

four_format_rules:
  textbook_pdf:
    description: "전문 교재 (Quarto / Typst → 인쇄용 PDF)"
    include:
      - "심화 원리 및 화학·물리·생물·수학 모델링 해설"
      - "정량 계산 예제 (SOC↔SOM 환산, Stanford-Smith 질소 무기화, RothC 5-풀 수지, t C/ha 산정)"
      - "현장·모델링 주의사항 콜아웃 (Callout)"
      - "단원말 핵심 용어집 표, 연습문제·정답지·상세 해설"
  curriculum_textbook_pdf:
    description: "교과서 단원본 (Quarto / Typst → 단원별 PDF)"
    include:
      - "도입부 성취기준 및 학습목표 박스"
      - "단계별 용어 해설 및 난이도 보정 문체"
      - "탐구 활동(생각해 보기) 및 형성평가 3문항"
  executive_report_docx_pdf:
    description: "심층 기술·정책 보고서 (Pandoc / Quarto → DOCX·PDF)"
    exclude:
      - "연습문제 및 교육용 탐구 활동"
    include:
      - "1페이지 핵심 요약 (Executive Summary)"
      - "비교 데이터 표 및 수치·모델 시나리오 근거 중심 분석 문체"
      - "정책·영농 현장 시사점 및 정식 참고문헌 자동 생성"
  interactive_web:
    description: "인터랙티브 웹페이지 (Next.js / Astro + MDX)"
    include:
      - "좌측 목차 네비게이션"
      - "본문 [SRC-NN] 호버 시 원문 근거 패킷 툴팁 표시"
      - "접이식 연습문제 해설 및 인터랙티브 모델 파라미터 표"

parts:
  - part_number: 1
    title: "제1부. 토양 유기물의 기초와 현대 패러다임"
    pages: 108
    chapters:
      - chapter_id: "ch01"
        chapter_number: 1
        title: "제1장. 토양 유기물(SOM)의 정의, 조성과 토양 생태계 기능"
        target_pages: 36
        pilot: true
        kg_reuse_status: "HIGH (C:\\SMC_GRAPHRAG 89.5% + POM/MAOM·국내외 학회지·교과서 통합)"
        learning_objectives:
          - "토양 유기물(SOM)과 토양 유기탄소(SOC)의 개념·환산 관계 및 전 지구 탄소순환에서의 위상을 설명할 수 있다."
          - "전통적 부식질(Humus) 패러다임과 현대 토양 연속체 모델(POM vs MAOM)의 구조적 차이를 비교·해석할 수 있다."
          - "토양 유기물이 토양 물리성·화학성·생물성에 미치는 다기능적 메커니즘을 정량적으로 설명할 수 있다."
        essential_concepts:
          - "토양 유기물(SOM) 및 토양 유기탄소(SOC)"
          - "활성·완효·난분해 수동 풀 vs 입자성(POM)·광물결합(MAOM) 분획"
          - "광물 포화 한계(Saturation Deficit)와 전 지구 MAOC 저장량"
        required_tables_figures:
          - "표 1-1: SOM과 SOC 및 3-풀 분류 요약"
          - "표 1-2: 입자성 유기물(POM) vs 광물결합 유기물(MAOM) 비교"

      - chapter_id: "ch02"
        chapter_number: 2
        title: "제2장. 토양 유기물의 기원, 생화학적 조성과 분해 동태 기초"
        target_pages: 36
        learning_objectives:
          - "지상부 잔사·뿌리·근권 삼출물의 생화학적 구성(셀룰로오스·헤미셀룰로오스·리그닌·지질)과 분해 난이도를 구분할 수 있다."
          - "온도(Q10), 수분, 통기성, 토성, pH가 유기물 분해 속도에 미치는 환경 조절 기작을 설명할 수 있다."
          - "잔사 분해 초기 질량 손실 곡선과 잔존 탄소 분율(휴민화 계수)을 계산할 수 있다."
        essential_concepts:
          - "식물 잔사 생화학 분획(수용성·셀룰로오스·리그닌)"
          - "분해 환경 요인(Q10, 토양수분포텐셜, 혐기/호기)"
          - "기초 1차 지수감쇠 분해 동태"
        required_tables_figures:
          - "표 2-1: 주요 농산부산물·녹비·퇴비 원료별 C/N비 및 리그닌/질소 비 비교표"

      - chapter_id: "ch03"
        chapter_number: 3
        title: "제3장. 부식화(Humification) 이론과 미생물 탄소 펌프(MCP)"
        target_pages: 36
        learning_objectives:
          - "부식산(HA), 풀빅산(FA), 휴민(Humin)의 화학적·분광학적(HA/FA 비, E4/E6 비, FTIR, 13C-NMR) 특성을 설명할 수 있다."
          - "전통적 고분자 중합 가설과 Lehmann & Kleber 토양 연속체 모델·미생물 탄소 펌프(MCP) 이론의 차이를 비교할 수 있다."
          - "미생물 사체(Necromass)와 점토·비정질 산화철/알루미늄 광물 표면 간 결합 메커니즘을 도식화할 수 있다."
        essential_concepts:
          - "부식산(HA)·풀빅산(FA)·휴민(Humin)"
          - "미생물 탄소 펌프(MCP)와 미생물 사체(Necromass)"
          - "광물 표면 안정화(배위결합·양이온 가교·비정질 광물 보호)"
        required_tables_figures:
          - "표 3-1: 전통적 부식화 이론 vs 현대 토양 연속체·미생물 탄소 펌프 이론 비교"

  - part_number: 2
    title: "제2부. 토양 물리·화학·생물 환경과 유기물 질소 동역학"
    pages: 136
    chapters:
      - chapter_id: "ch04"
        chapter_number: 4
        title: "제4장. 토양 유기물과 토양 물리성·단립 구조"
        target_pages: 34
        learning_objectives:
          - "대단립(>250 μm)과 소단립(53~250 μm) 계층 구조에서 POM·균사·다당류의 역할을 설명할 수 있다."
          - "토양 유기물 증가에 따른 유효수분보유능(AWC), 침투율, 용적밀도 개선 효과를 정량 평가할 수 있다."
          - "경운 교란에 의한 단립 파괴와 물리적 보호 탄소(Aggregate-associated C) 손실 경로를 분석할 수 있다."
        essential_concepts:
          - "단립 계층 모델(Aggregate Hierarchy)"
          - "유효수분보유능(AWC) 및 가뭄 저항성"
          - "물리적 보호(Physical Occlusion)"
        required_tables_figures:
          - "표 4-1: 경운 vs 무경운 토양의 대단립·소단립 내 유기탄소 분포 비교"

      - chapter_id: "ch05"
        chapter_number: 5
        title: "제5장. 토양 유기물과 토양 화학성·양분 및 오염물질 거동"
        target_pages: 32
        learning_objectives:
          - "카르복실기·페놀성 수산기의 해리에 따른 pH 의존 음전하와 양이온치환용량(CEC) 기여도를 산출할 수 있다."
          - "유기산 킬레이트화가 인산 고정 저감 및 미량원소 유효도에 미치는 원리를 설명할 수 있다."
          - "토양 유기물과 바이오차·탄소계 흡착제가 중금속·잔류성 농약(디엘드린 등) 생물유효성에 미치는 영향을 평가할 수 있다."
        essential_concepts:
          - "pH 의존 음전하와 양이온치환용량(CEC)"
          - "유기산 킬레이트와 인산 가용화"
          - "중금속 착물 형성 및 잔류성 유기오염물질 흡착(Koc)"
        required_tables_figures:
          - "표 5-1: 점토광물 대비 부식질의 CEC 및 작용기 해리 pKa 비교"

      - chapter_id: "ch06"
        chapter_number: 6
        title: "제6장. 토양 미생물 군집, 근권 생태계 및 프라이밍 효과"
        target_pages: 34
        learning_objectives:
          - "세균·균근균(AMF)·PGPR·지렁이(토양대형동물)가 유기물 분해와 생태계 서비스에 미치는 역할을 설명할 수 있다."
          - "신선 유기물 투입 시 기존 SOM 분해가 가속·억제되는 양성·음성 프라이밍 효과(Priming Effect)의 조건을 분석할 수 있다."
          - "토양 효소 활성과 미생물 생체량 탄소(MBC)·대사계수(qCO2) 지표를 해석할 수 있다."
        essential_concepts:
          - "근권(Rhizosphere)·균근균(AMF)·지렁이 생태계 공학"
          - "양성·음성 프라이밍 효과(Priming Effect)"
          - "미생물 생체량 탄소(MBC)와 토양 효소"
        required_tables_figures:
          - "표 6-1: 토양 생물군(세균·진균·지렁이)별 유기물 변환 경로 및 기능 요약"

      - chapter_id: "ch07"
        chapter_number: 7
        title: "제7장. 유기물의 질소 동역학, 무기화·부동화 및 질소 순환 모델 [신설]"
        target_pages: 36
        added_in_v2: true
        learning_objectives:
          - "유기물 탄질비(C/N)와 미생물 탄소이용효율(CUE) 기반 전 지구 화학양론(Manzoni 등)으로 질소 순무기화·부동화 임계점을 계산할 수 있다."
          - "해중합(Depolymerization) 율속 패러다임(Schimel & Bennett)과 Stanford-Smith 1차 질소 무기화 모델(Nt = N0(1-e^-kt))을 적용할 수 있다."
          - "질산화·탈질·N2O 배출 및 질산태 용탈을 모의하는 C-N 연계 모델(DNDC·DayCent·APSIM-SoilN)과 국내 퇴비·녹비 질소 공급량 예측 절차를 설계할 수 있다."
        essential_concepts:
          - "C/N 화학양론(Stoichiometry)과 미생물 탄소이용효율(CUE)"
          - "고분자 유기질소 해중합(Depolymerization) 병목 이론"
          - "Stanford-Smith 질소 무기화 잠재량(N0, k) 및 유효적산온도 보정"
          - "질산화·탈질·N2O·NO3- 용탈 연계 모델 (DNDC, DayCent, APSIM)"
        required_tables_figures:
          - "표 7-1: 유기물 C/N비 및 CUE 조건별 순질소 무기화 vs 부동화 임계점 계산표"
          - "표 7-2: 주요 질소 동역학 모델(Stanford-Smith, DNDC, DayCent, APSIM-SoilN) 비교"

  - part_number: 3
    title: "제3부. 토양 유기물 분석, 분획 및 탄소·질소 분해 모델링(이론과 실전)"
    pages: 140
    chapters:
      - chapter_id: "ch08"
        chapter_number: 8
        title: "제8장. 토양 유기탄소·유기물 정량 및 분광 정성 분석법"
        target_pages: 34
        learning_objectives:
          - "국립농업과학원 Tyurin법, Walkley-Black 습식산화, 건식연소(Dumas), 강열감량(LOI)의 원리·회수율·오차를 비교할 수 있다."
          - "토색판·SPAD 503 등 현장 간이 추정법과 Vis-NIR/MIR·FTIR·13C-NMR 분광 분석의 적용 범위를 판단할 수 있다."
          - "탄산염 함유 토양의 무기탄소 제거 전처리 및 Van Bemmelen 계수(1.724 vs 2.0) 보정 절차를 적용할 수 있다."
        essential_concepts:
          - "Tyurin법 / Walkley-Black vs 원소분석기 건식연소"
          - "강열감량(LOI) 및 토색판·SPAD 현장 신속 추정"
          - "FTIR·13C-NMR·Vis-NIR/MIR 분광법"
        required_tables_figures:
          - "표 8-1: SOC·SOM 4대 표준 분석법(Tyurin, Walkley-Black, Dumas, LOI) 정밀도·비용 비교"

      - chapter_id: "ch09"
        chapter_number: 9
        title: "제9장. 물리·화학적 분획법과 토양건강 종합 평가(흙토람·Cornell CASH)"
        target_pages: 32
        learning_objectives:
          - "53 μm 입자크기 및 밀도 분획을 통한 POM·MAOM 분리 표준 프로토콜을 설계할 수 있다."
          - "활성탄소(POXC), 열수추출유기탄소(WEOC), 용존유기물(DOM) 지표의 단기 관리 민감도를 해석할 수 있다."
          - "국내 흙토람 토양검정, 미국 Cornell CASH, 유럽 토양건강 지표를 비교·적용할 수 있다."
        essential_concepts:
          - "입자크기(53 μm)·밀도 물리 분획(POM/MAOM)"
          - "활성탄소(POXC)와 용존유기물(DOM)"
          - "흙토람 vs Cornell CASH 종합 토양건강 평가"
        required_tables_figures:
          - "표 9-1: 국내 흙토람·미국 Cornell CASH·유럽 EEA 토양유기물 핵심 지표 비교표"

      - chapter_id: "ch10"
        chapter_number: 10
        title: "제10장. 토양 탄소 분해 모델의 이론 — 1차 다중 풀(RothC·CENTURY)에서 미생물 명시형(MIMICS)까지 [심화 개편]"
        target_pages: 38
        added_in_v2: true
        learning_objectives:
          - "선형 구획 미분방정식 행렬 표현(dC/dt = I + A·C, SoilR 이론)으로 다중 풀 탄소 분해 모델의 수학적 구조를 정식화할 수 있다."
          - "RothC(DPM·RPM·BIO·HUM·IOM 5-풀, 분해상수 k)와 CENTURY/DayCent(활성·완효·수동 3-풀)의 수식·온도/수분 보정·점토 분배식을 유도·비교할 수 있다."
          - "차세대 비선형 미생물 명시형 모델(MIMICS·CORPSE, Michaelis-Menten 역학)과 POM-MAOM 연계 모델이 1차 선형 모델의 기후 피드백 한계를 어떻게 극복하는지 설명할 수 있다."
        essential_concepts:
