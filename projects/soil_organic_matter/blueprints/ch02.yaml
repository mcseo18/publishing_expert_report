chapter_id: ch02
chapter_number: 2
title: 제2장. 토양 유기물의 기원, 생화학적 조성과 분해 동태 기초
target_pages: 36
target_audience: 농학·토양환경학 대학 전공 심화(학부 3~4학년·대학원생), 농업연구사, 토양·비료·탄소중립 모델링 실무 전문가
evidence_packet: data/evidence/ch02_evidence.json
learning_objectives:
- 지상부 잔사·뿌리·근권 삼출물의 생화학적 구성(셀룰로오스·헤미셀룰로오스·리그닌·지질)과 분해 난이도를 구분할 수 있다.
- 온도(Q10), 수분, 통기성, 토성, pH가 유기물 분해 속도에 미치는 환경 조절 기작을 설명할 수 있다.
- 잔사 분해 초기 질량 손실 곡선과 잔존 탄소 분율(휴민화 계수)을 계산할 수 있다.
