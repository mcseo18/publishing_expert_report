chapter_id: ch04
chapter_number: 4
title: 제4장. 토양 유기물과 토양 물리성·단립 구조
target_pages: 34
target_audience: 농학·토양환경학 대학 전공 심화(학부 3~4학년·대학원생), 농업연구사, 토양·비료·탄소중립 모델링 실무 전문가
evidence_packet: data/evidence/ch04_evidence.json
learning_objectives:
- 대단립(>250 μm)과 소단립(53~250 μm) 계층 구조에서 POM·균사·다당류의 역할을 설명할 수 있다.
- 토양 유기물 증가에 따른 유효수분보유능(AWC), 침투율, 용적밀도 개선 효과를 정량 평가할 수 있다.
- 경운 교란에 의한 단립 파괴와 물리적 보호 탄소(Aggregate-associated C) 손실 경로를 분석할 수 있다.
