chapter_id: ch14
chapter_number: 14
title: 제14장. 바이오차(Biochar) 및 기능성 부식산·풀빅산 자재의 토양 적용
target_pages: 30
target_audience: 농학·토양환경학 대학 전공 심화(학부 3~4학년·대학원생), 농업연구사, 토양·비료·탄소중립 모델링 실무 전문가
evidence_packet: data/evidence/ch14_evidence.json
learning_objectives:
- 열분해 온도(350~700°C)별 바이오차의 H/Corg 안정성, 비표면적, pH, 난분해성 수명을 설명할 수 있다.
- 일본 농림수산성(MAFF) 바이오차 시용량 상한 지침과 논토양 왕겨 바이오차(CH4/N2O 비자극, SSPN 실증) 사례를 평가할 수 있다.
- 부식산·풀빅산 바이오스티뮬런트(옥신 유사 활성)의 생리적 작용과 과학적 검증 한계를 구분할 수 있다.
