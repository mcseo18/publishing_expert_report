chapter_id: ch12
chapter_number: 12
title: 제12장. 국내외 논·밭·시설재배지 토양 유기물 변동과 적정 기준(한국 흙토람·일본 MAFF 비교)
target_pages: 32
target_audience: 농학·토양환경학 대학 전공 심화(학부 3~4학년·대학원생), 농업연구사, 토양·비료·탄소중립 모델링 실무 전문가
evidence_packet: data/evidence/ch12_evidence.json
learning_objectives:
- 담수 논토양(혐기 지연·메탄 트레이드오프), 밭토양(호기 산화), 시설재배지(염류·인산 과잉)의 유기물 동태 차이를 비교할 수 있다.
- 농촌진흥청 흙토람 적정 유기물 기준과 일본 농림수산성(MAFF) 도도부현 시비·지력증진 기준을 비교·해석할 수 있다.
- 토양검정 비료사용처방서를 바탕으로 과부족 유기물 시용량을 산정할 수 있다.
