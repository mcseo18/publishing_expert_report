chapter_id: ch15
chapter_number: 15
title: 제15장. 심토(Subsoil), 이탄지·습지, 산림·초지 및 화산회토(Andosol)의 유기물 동태 [신설]
target_pages: 30
target_audience: 농학·토양환경학 대학 전공 심화(학부 3~4학년·대학원생), 농업연구사, 토양·비료·탄소중립 모델링 실무 전문가
evidence_packet: data/evidence/ch15_evidence.json
learning_objectives:
- 심토(30~100 cm+)의 높은 MAOM 미포화 결핍과 심근성 작물·뿌리 유래 탄소의 장기 격리 잠재력을 정량 설명할 수 있다.
- 이탄지·습지의 혐기성 유기탄소 축적 메커니즘과 배수·개간 시 발생하는 급격한 탄소 손실 위험을 평가할 수 있다.
- 제주·일본 화산회토(Andosol)의 비정질 알로페인·철/알루미늄 산화물에 의한 특이적 유기물 보호(EJSS·SSPN 근거)와 온난화(Q10)
  피드백을 분석할 수 있다.
