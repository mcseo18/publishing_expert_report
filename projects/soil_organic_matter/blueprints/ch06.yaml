chapter_id: ch06
chapter_number: 6
title: 제6장. 토양 미생물 군집, 근권 생태계 및 프라이밍 효과
target_pages: 34
target_audience: 농학·토양환경학 대학 전공 심화(학부 3~4학년·대학원생), 농업연구사, 토양·비료·탄소중립 모델링 실무 전문가
evidence_packet: data/evidence/ch06_evidence.json
learning_objectives:
- 세균·균근균(AMF)·PGPR·지렁이(토양대형동물)가 유기물 분해와 생태계 서비스에 미치는 역할을 설명할 수 있다.
- 신선 유기물 투입 시 기존 SOM 분해가 가속·억제되는 양성·음성 프라이밍 효과(Priming Effect)의 조건을 분석할 수 있다.
- 토양 효소 활성과 미생물 생체량 탄소(MBC)·대사계수(qCO2) 지표를 해석할 수 있다.
