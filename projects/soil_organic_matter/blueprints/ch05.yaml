chapter_id: ch05
chapter_number: 5
title: 제5장. 토양 유기물과 토양 화학성·양분 및 오염물질 거동
target_pages: 32
target_audience: 농학·토양환경학 대학 전공 심화(학부 3~4학년·대학원생), 농업연구사, 토양·비료·탄소중립 모델링 실무 전문가
evidence_packet: data/evidence/ch05_evidence.json
learning_objectives:
- 카르복실기·페놀성 수산기의 해리에 따른 pH 의존 음전하와 양이온치환용량(CEC) 기여도를 산출할 수 있다.
- 유기산 킬레이트화가 인산 고정 저감 및 미량원소 유효도에 미치는 원리를 설명할 수 있다.
- 토양 유기물과 바이오차·탄소계 흡착제가 중금속·잔류성 농약(디엘드린 등) 생물유효성에 미치는 영향을 평가할 수 있다.
