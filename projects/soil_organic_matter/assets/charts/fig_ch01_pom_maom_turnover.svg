<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" style="background:#ffffff;font-family:'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;">
  <rect x="0" y="0" width="760" height="380" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="0" y="0" width="760" height="52" rx="10" fill="#0f172a"/>
  <rect x="0" y="38" width="760" height="14" fill="#0f172a"/>
  <text x="20" y="24" font-size="14" font-weight="700" fill="#f8fafc">POM vs MAOM 평균 체류시간(년) 및 전 지구 MAOC 포화 지표</text>
  <text x="20" y="43" font-size="10.5" fill="#94a3b8">출처: Nature Communications 2024 [SRC-05] &amp; Georgiou et al. 2022 [SRC-06]</text>
  <text x="22" y="96" font-size="11.5" font-weight="600" fill="#1e293b">POM 평균 체류시간</text>
  <rect x="215" y="82" width="380" height="22" rx="4" fill="#f1f5f9"/>
  <rect x="215" y="82" width="58" height="22" rx="4" fill="#f59e0b"/>
  <text x="280" y="97" font-size="11" font-weight="700" fill="#0f172a">23 (년 / %)</text>
  <text x="22" y="111" font-size="9.5" fill="#64748b">빠른 순환 · 단기 양분 공급 및 토양 단립 형성</text>
  <text x="22" y="142" font-size="11.5" font-weight="600" fill="#1e293b">MAOM 평균 체류시간</text>
  <rect x="215" y="128" width="380" height="22" rx="4" fill="#f1f5f9"/>
  <rect x="215" y="128" width="326" height="22" rx="4" fill="#2563eb"/>
  <text x="548" y="143" font-size="11" font-weight="700" fill="#0f172a">129 (년 / %)</text>
  <text x="22" y="157" font-size="9.5" fill="#64748b">광물 표면 화학 결합 · 장기 탄소 격리 핵심</text>
  <text x="22" y="188" font-size="11.5" font-weight="600" fill="#1e293b">전 지구 MAOC 포화율</text>
  <rect x="215" y="174" width="380" height="22" rx="4" fill="#f1f5f9"/>
  <rect x="215" y="174" width="106" height="22" rx="4" fill="#10b981"/>
  <text x="328" y="189" font-size="11" font-weight="700" fill="#0f172a">42 (년 / %)</text>
  <text x="22" y="203" font-size="9.5" fill="#64748b">현재 899 Pg C 저장 (비동결 광질토 1m 기준 미포화 58%)</text>
  <text x="22" y="234" font-size="11.5" font-weight="600" fill="#1e293b">미포화 토양 축적배수 (×10)</text>
  <rect x="215" y="220" width="380" height="22" rx="4" fill="#f1f5f9"/>
  <rect x="215" y="220" width="76" height="22" rx="4" fill="#8b5cf6"/>
  <text x="298" y="235" font-size="11" font-weight="700" fill="#0f172a">30 (년 / %)</text>
  <text x="22" y="249" font-size="9.5" fill="#64748b">포화도 1/10 토양은 1/2 토양 대비 약 3배 빠른 탄소 축적</text>
</svg>