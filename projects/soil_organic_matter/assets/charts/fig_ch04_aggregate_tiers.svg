<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" style="background:#ffffff;font-family:'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;">
  <rect x="0" y="0" width="760" height="380" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="0" y="0" width="760" height="52" rx="10" fill="#0f172a"/>
  <rect x="0" y="38" width="760" height="14" fill="#0f172a"/>
  <text x="20" y="24" font-size="14" font-weight="700" fill="#f8fafc">토양 단립 계층 모델 (Aggregate Hierarchy) 및 탄소 보호 기간</text>
  <text x="20" y="43" font-size="10.5" fill="#94a3b8">출처: 미국토양학회지 SSSAJ [SRC-42, SRC-44] &amp; FAO Soils Bulletin 80 [SRC-03]</text>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/></marker></defs>
  <line x1="180" y1="150" x2="228" y2="150" stroke="#334155" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="204" y="145" text-anchor="middle" font-size="9.5" font-weight="600" fill="#1d4ed8">결속</text>
  <line x1="405" y1="150" x2="453" y2="150" stroke="#334155" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="429" y="145" text-anchor="middle" font-size="9.5" font-weight="600" fill="#1d4ed8">균사·뿌리</text>
  <line x1="545" y1="190" x2="545" y2="238" stroke="#334155" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="545" y="209" text-anchor="middle" font-size="9.5" font-weight="600" fill="#1d4ed8">경운 교란</text>
  <rect x="25" y="110" width="155" height="80" rx="8" fill="#dbeafe" stroke="#1e293b" stroke-width="1.2"/>
  <text x="102" y="132" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">점토·미사 일차입자</text>
  <text x="102" y="148" text-anchor="middle" font-size="9.5" fill="#334155">(&lt; 53 μm)</text>
  <text x="102" y="161" text-anchor="middle" font-size="9.5" fill="#334155">MAOM 화학 결합</text>
  <text x="102" y="174" text-anchor="middle" font-size="9.5" fill="#334155">수십~수백 년 보호</text>
  <rect x="230" y="110" width="175" height="80" rx="8" fill="#bbf7d0" stroke="#1e293b" stroke-width="1.2"/>
  <text x="317" y="132" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">소단립 (Microaggregate)</text>
  <text x="317" y="148" text-anchor="middle" font-size="9.5" fill="#334155">(53 ~ 250 μm)</text>
  <text x="317" y="161" text-anchor="middle" font-size="9.5" fill="#334155">다당류·다가양이온 가교</text>
  <text x="317" y="174" text-anchor="middle" font-size="9.5" fill="#334155">수십 년 물리적 보호</text>
  <rect x="455" y="110" width="185" height="80" rx="8" fill="#fef3c7" stroke="#1e293b" stroke-width="1.2"/>
  <text x="547" y="132" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">대단립 (Macroaggregate)</text>
  <text x="547" y="148" text-anchor="middle" font-size="9.5" fill="#334155">(&gt; 250 μm)</text>
  <text x="547" y="161" text-anchor="middle" font-size="9.5" fill="#334155">균근균 균사·잔뿌리 결속</text>
  <text x="547" y="174" text-anchor="middle" font-size="9.5" fill="#334155">경운에 민감 · 수년 보호</text>
  <rect x="230" y="240" width="410" height="62" rx="8" fill="#fee2e2" stroke="#1e293b" stroke-width="1.2"/>
  <text x="435" y="262" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">강한 경운(Tillage) → 대단립 파괴 → 보호된 POM 노출 · CO2 손실 가속</text>
  <text x="435" y="278" text-anchor="middle" font-size="9.5" fill="#334155">무경운·피복작물·퇴비 시용으로 단립 계층 회복 [SRC-19, SRC-23]</text>
</svg>