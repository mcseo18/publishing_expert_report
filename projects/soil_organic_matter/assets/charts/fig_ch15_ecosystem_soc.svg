<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" style="background:#ffffff;font-family:'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;">
  <rect x="0" y="0" width="760" height="380" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="0" y="0" width="760" height="52" rx="10" fill="#0f172a"/>
  <rect x="0" y="38" width="760" height="14" fill="#0f172a"/>
  <text x="20" y="24" font-size="14" font-weight="700" fill="#f8fafc">특수 토양 생태계별 토양 유기탄소 안정화 기작과 기후 취약성</text>
  <text x="20" y="43" font-size="10.5" fill="#94a3b8">출처: Nature Climate-Smart Soils [SRC-80] · Wetland Loss [SRC-81] · EJSS 심토 광물보호 [SRC-51]</text>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/></marker></defs>
  <rect x="20" y="90" width="170" height="165" rx="8" fill="#dbeafe" stroke="#1e293b" stroke-width="1.2"/>
  <text x="105" y="112" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">심토 (Subsoil)</text>
  <text x="105" y="128" text-anchor="middle" font-size="9.5" fill="#334155">30~100 cm+</text>
  <text x="105" y="141" text-anchor="middle" font-size="9.5" fill="#334155">· 높은 MAOM 미포화 결핍</text>
  <text x="105" y="154" text-anchor="middle" font-size="9.5" fill="#334155">· 심근성 뿌리 탄소 핵심</text>
  <text x="105" y="167" text-anchor="middle" font-size="9.5" fill="#334155">· 저장 잠재력 우수</text>
  <text x="105" y="180" text-anchor="middle" font-size="9.5" fill="#334155">[SRC-06, SRC-51]</text>
  <rect x="204" y="90" width="170" height="165" rx="8" fill="#f3e8ff" stroke="#1e293b" stroke-width="1.2"/>
  <text x="289" y="112" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">화산회토 (Andosol)</text>
  <text x="289" y="128" text-anchor="middle" font-size="9.5" fill="#334155">제주·일본 화산재 기원</text>
  <text x="289" y="141" text-anchor="middle" font-size="9.5" fill="#334155">· 비정질 알로페인·Al/Fe</text>
  <text x="289" y="154" text-anchor="middle" font-size="9.5" fill="#334155">  유기복합체 초강력 보호</text>
  <text x="289" y="167" text-anchor="middle" font-size="9.5" fill="#334155">· 극고농도 유기탄소 축적</text>
  <text x="289" y="180" text-anchor="middle" font-size="9.5" fill="#334155">[SRC-38, SRC-51, SRC-82]</text>
  <rect x="388" y="90" width="170" height="165" rx="8" fill="#fee2e2" stroke="#1e293b" stroke-width="1.2"/>
  <text x="473" y="112" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">이탄지·습지 (Peat)</text>
  <text x="473" y="128" text-anchor="middle" font-size="9.5" fill="#334155">혐기·과습 환경</text>
  <text x="473" y="141" text-anchor="middle" font-size="9.5" fill="#334155">· 전 지구 면적 소수이나</text>
  <text x="473" y="154" text-anchor="middle" font-size="9.5" fill="#334155">  막대한 탄소 집중 저장</text>
  <text x="473" y="167" text-anchor="middle" font-size="9.5" fill="#334155">· 배수 시 급격한 CO2 방출</text>
  <text x="473" y="180" text-anchor="middle" font-size="9.5" fill="#334155">[SRC-81]</text>
  <rect x="572" y="90" width="168" height="165" rx="8" fill="#dcfce7" stroke="#1e293b" stroke-width="1.2"/>
  <text x="656" y="112" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">산림·초지 (Forest)</text>
  <text x="656" y="128" text-anchor="middle" font-size="9.5" fill="#334155">다년생 식생·무경운</text>
  <text x="656" y="141" text-anchor="middle" font-size="9.5" fill="#334155">· 풍부한 표층 낙엽(O층)</text>
  <text x="656" y="154" text-anchor="middle" font-size="9.5" fill="#334155">  및 심층 뿌리 네트워크</text>
  <text x="656" y="167" text-anchor="middle" font-size="9.5" fill="#334155">· 온난화(Q10) 피드백 주의</text>
  <text x="656" y="180" text-anchor="middle" font-size="9.5" fill="#334155">[SRC-07, SRC-43, SRC-80]</text>
</svg>