<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" style="background:#ffffff;font-family:'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;">
  <rect x="0" y="0" width="760" height="380" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="0" y="0" width="760" height="52" rx="10" fill="#0f172a"/>
  <rect x="0" y="38" width="760" height="14" fill="#0f172a"/>
  <text x="20" y="24" font-size="14" font-weight="700" fill="#f8fafc">국내외 농경지 유형별(논 · 밭 · 시설재배지) 유기물 동태와 핵심 관리 과제</text>
  <text x="20" y="43" font-size="10.5" fill="#94a3b8">출처: 한국 흙토람·농사로 [SRC-01, SRC-18] · 일본 MAFF 시비기준 [SRC-33]</text>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/></marker></defs>
  <rect x="24" y="92" width="218" height="165" rx="8" fill="#dbeafe" stroke="#1e293b" stroke-width="1.2"/>
  <text x="133" y="114" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">담수 논토양 (Paddy)</text>
  <text x="133" y="130" text-anchor="middle" font-size="9.5" fill="#334155">혐기 조건 → 분해 지연</text>
  <text x="133" y="143" text-anchor="middle" font-size="9.5" fill="#334155">· 유기탄소 축적 유리</text>
  <text x="133" y="156" text-anchor="middle" font-size="9.5" fill="#334155">· 주의: 생짚 과다 시 메탄(CH4)</text>
  <text x="133" y="169" text-anchor="middle" font-size="9.5" fill="#334155">  배출 증가 상충 관리</text>
  <text x="133" y="182" text-anchor="middle" font-size="9.5" fill="#334155">[SRC-01, SRC-38, SRC-62]</text>
  <rect x="270" y="92" width="220" height="165" rx="8" fill="#fef3c7" stroke="#1e293b" stroke-width="1.2"/>
  <text x="380" y="114" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">노지 밭토양 (Upland)</text>
  <text x="380" y="130" text-anchor="middle" font-size="9.5" fill="#334155">호기·경운 → 산화 분해 빠름</text>
  <text x="380" y="143" text-anchor="middle" font-size="9.5" fill="#334155">· 유기물 소모 빨라 보충 필수</text>
  <text x="380" y="156" text-anchor="middle" font-size="9.5" fill="#334155">· 퇴비·녹비(헤어리베치)·</text>
  <text x="380" y="169" text-anchor="middle" font-size="9.5" fill="#334155">  피복작물로 단립·보수력 회복</text>
  <text x="380" y="182" text-anchor="middle" font-size="9.5" fill="#334155">[SRC-01, SRC-19, SRC-33]</text>
  <rect x="518" y="92" width="218" height="165" rx="8" fill="#fee2e2" stroke="#1e293b" stroke-width="1.2"/>
  <text x="627" y="114" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">시설재배지 (Greenhouse)</text>
  <text x="627" y="130" text-anchor="middle" font-size="9.5" fill="#334155">고온·무강우 → 염류(EC) 집적</text>
  <text x="627" y="143" text-anchor="middle" font-size="9.5" fill="#334155">· 가축분퇴비 과다 시용 주의</text>
  <text x="627" y="156" text-anchor="middle" font-size="9.5" fill="#334155">· 토양검정 기반 적정 시용 &amp;</text>
  <text x="627" y="169" text-anchor="middle" font-size="9.5" fill="#334155">  수분감지기 연계 물관리</text>
  <text x="627" y="182" text-anchor="middle" font-size="9.5" fill="#334155">[SRC-01, SRC-18, SRC-87]</text>
</svg>