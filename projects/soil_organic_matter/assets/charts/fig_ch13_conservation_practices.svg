  <text x="106" y="136" text-anchor="middle" font-size="9.5" fill="#334155">부식산·CEC 증진</text>
  <rect x="205" y="85" width="165" height="70" rx="8" fill="#dbeafe" stroke="#1e293b" stroke-width="1.2"/>
  <text x="287" y="107" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">2. 녹비·피복작물</text>
  <text x="287" y="123" text-anchor="middle" font-size="9.5" fill="#334155">헤어리베치·호밀 환원</text>
  <text x="287" y="136" text-anchor="middle" font-size="9.5" fill="#334155">근권 탄소·질소 공급</text>
  <rect x="386" y="85" width="165" height="70" rx="8" fill="#fef3c7" stroke="#1e293b" stroke-width="1.2"/>
  <text x="468" y="107" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">3. 깊이거름주기</text>
