  <rect x="0" y="38" width="760" height="14" fill="#0f172a"/>
  <text x="20" y="24" font-size="14" font-weight="700" fill="#f8fafc">농경지 유기물 증진 4대 현장 실천 기술과 시너지 경로</text>
  <text x="20" y="43" font-size="10.5" fill="#94a3b8">출처: 농사로 깊이거름주기 실증 [SRC-17] · USDA SARE 4판 [SRC-19, SRC-23] · 농업기술길잡이 [SRC-26]</text>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/></marker></defs>
  <line x1="106" y1="155" x2="220" y2="213" stroke="#334155" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="287" y1="155" x2="320" y2="213" stroke="#334155" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="468" y1="155" x2="440" y2="213" stroke="#334155" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="651" y1="155" x2="540" y2="213" stroke="#334155" stroke-width="1.8" marker-end="url(#arr)"/>
  <rect x="24" y="85" width="165" height="70" rx="8" fill="#dcfce7" stroke="#1e293b" stroke-width="1.2"/>
