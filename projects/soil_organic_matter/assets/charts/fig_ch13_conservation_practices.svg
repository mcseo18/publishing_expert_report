  <text x="468" y="136" text-anchor="middle" font-size="9.5" fill="#334155">양분 손실·가스 저감</text>
  <rect x="567" y="85" width="168" height="70" rx="8" fill="#f3e8ff" stroke="#1e293b" stroke-width="1.2"/>
  <text x="651" y="107" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">4. 무경운·최소경운</text>
  <text x="651" y="123" text-anchor="middle" font-size="9.5" fill="#334155">대단립 파괴 억제</text>
