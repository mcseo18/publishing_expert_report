  <rect x="110" y="215" width="540" height="62" rx="8" fill="#e0f2fe" stroke="#1e293b" stroke-width="1.2"/>
  <text x="380" y="237" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">통합 목표: 단기 양분순환(POM) + 장기 탄소격리(MAOM) + 가뭄저항성·수확량 안정화</text>
  <text x="380" y="253" text-anchor="middle" font-size="9.5" fill="#334155">단독 기술보다 2~3종 복합 적용 시 토양건강·탄소축적 시너지 극대화 [SRC-19, SRC-23]</text>
