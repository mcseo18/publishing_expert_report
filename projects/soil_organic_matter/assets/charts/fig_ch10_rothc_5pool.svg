  <rect x="175" y="252" width="555" height="48" rx="8" fill="#f3e8ff" stroke="#1e293b" stroke-width="1.2"/>
  <text x="452" y="274" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">차세대 확장 (MIMICS / MEMS): Michaelis-Menten 미생물 효소 역학 + 광물 포화 반영 [SRC-54, SRC-58]</text>
