  <text x="77" y="138" text-anchor="middle" font-size="9.5" fill="#334155">월별 탄소 유입</text>
  <text x="77" y="151" text-anchor="middle" font-size="9.5" fill="#334155">(DPM/RPM 분할)</text>
  <rect x="175" y="76" width="130" height="56" rx="8" fill="#fde68a" stroke="#1e293b" stroke-width="1.2"/>
  <text x="240" y="98" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">DPM (이분해성)</text>
  <text x="240" y="114" text-anchor="middle" font-size="9.5" fill="#334155">k = 10.0 yr⁻¹</text>
  <text x="240" y="127" text-anchor="middle" font-size="9.5" fill="#334155">수개월 내 분해</text>
  <rect x="175" y="160" width="130" height="56" rx="8" fill="#fed7aa" stroke="#1e293b" stroke-width="1.2"/>
