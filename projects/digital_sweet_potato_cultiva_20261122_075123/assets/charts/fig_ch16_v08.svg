  <rect x="0" y="42" width="800" height="16" fill="#312e81"/>
  <text x="22" y="27" font-size="15" font-weight="700" fill="#f8fafc">그림 16-8. 제16장. 통합 병해충 관리·예찰의 원리와 디지털 현장 관리 — 현장 이상 진단 및 대응</text>
  <text x="22" y="47" font-size="11" fill="#cbd5e1">디지털 고구마 재배 · 16.4 디지털 현장 적용</text>
  <rect x="40" y="88" width="345" height="135" rx="10" fill="#dcfce7" stroke="#166534" stroke-width="1.5"/>
  <text x="58" y="124" font-size="14" font-weight="700" fill="#166534">정상·최적 상태</text>
  <text x="58" y="158" font-size="12" fill="#1e293b">16.1 기초 원리 및 개념</text>
  <text x="58" y="190" font-size="11" fill="#475569">정량 계측 → 임계 판정 → 현장 처방</text>
  <rect x="415" y="88" width="345" height="135" rx="10" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
  <text x="433" y="124" font-size="14" font-weight="700" fill="#1e40af">예방적 디지털 모니터링</text>
  <text x="433" y="158" font-size="12" fill="#1e293b">16.2 정량 측정·모델링</text>
  <text x="433" y="190" font-size="11" fill="#475569">정량 계측 → 임계 판정 → 현장 처방</text>
  <rect x="40" y="245" width="345" height="135" rx="10" fill="#fef9c3" stroke="#854d0e" stroke-width="1.5"/>
  <text x="58" y="281" font-size="14" font-weight="700" fill="#854d0e">주의·임계치 접근</text>
  <text x="58" y="315" font-size="12" fill="#1e293b">16.3 국내외 기준 비교</text>
  <text x="58" y="347" font-size="11" fill="#475569">정량 계측 → 임계 판정 → 현장 처방</text>
  <rect x="415" y="245" width="345" height="135" rx="10" fill="#fee2e2" stroke="#991b1b" stroke-width="1.5"/>
  <text x="433" y="281" font-size="14" font-weight="700" fill="#991b1b">즉각 교정·방제 조치</text>
  <text x="433" y="315" font-size="12" fill="#1e293b">16.4 디지털 현장 적용</text>
  <text x="433" y="347" font-size="11" fill="#475569">정량 계측 → 임계 판정 → 현장 처방</text>
