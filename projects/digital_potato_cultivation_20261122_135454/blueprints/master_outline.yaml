book_metadata:
  title_ko: 디지털 감자 재배
  title_en: Digital Potato Cultivation
  target_audience: 대학 전공 심화, 대학원생, 연구자 및 선도 현장 실무자
  book_summary_ko: 본 교재는 감자 재배의 기초 생리학부터 첨단 유전공학, 디지털 정밀 농업 기술을 통합적으로 다루는 심화 연구서입니다. 씨감자 관리, 광합성 효율 분석, 양분 동태 모델링 등 핵심 생리 메커니즘을 정량적으로 분석하며, IoT와
    AI 기반의 통합 디지털 관리 시스템 구축 방법을 제시합니다. 연구자와 현장 실무자가 복합적인 환경 스트레스와 병해충을 극복하고 최적의 수확량을 달성할 수 있는 과학적 기반을 제공합니다.
