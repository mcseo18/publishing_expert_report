  <text x="433" y="122" font-size="14" font-weight="700" fill="#1e40af">예방적 디지털 모니터링</text>
  <text text-anchor="start" font-size="11.8" font-weight="600" fill="#1e293b"><tspan x="433" y="150.0">11.2 감자 내 특정 형질</tspan><tspan x="433" y="166.0">등) 조절</tspan></text>
