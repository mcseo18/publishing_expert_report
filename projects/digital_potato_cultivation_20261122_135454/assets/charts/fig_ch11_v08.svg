  <text x="58" y="279" font-size="14" font-weight="700" fill="#854d0e">주의 · 임계치 접근</text>
  <text text-anchor="start" font-size="11.8" font-weight="600" fill="#1e293b"><tspan x="58" y="307.0">11.3 유전자 편집 작물 규제 및 상업화</tspan><tspan x="58" y="323.0">동향</tspan></text>
