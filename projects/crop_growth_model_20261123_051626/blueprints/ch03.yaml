summary_ko: 작물의 생장에 필수적인 물과 주요 영양소인 질소의 거동을 물리적으로 모델링하는 방법을 학습합니다. 토양-작물-대기 시스템 간의 복잡한 수분 이동과 질소 순환 과정을 정량적 방정식으로 표현합니다.
