    title: 제2장. 광합성, 에너지 동역학 및 생체량 변화 모델링
    target_pages: 25
    summary_ko: 이 장은 작물 생장 과정의 핵심인 에너지 변환 과정을 수학적으로 정량화하는 방법을 다룹니다. 광합성률을 결정하는 환경 변수(광량, 온도)의 영향을 분석하고, 이를 생체량 증가로 연결하는 동역학적 방정식을 심층적으로 학습합니다.
    sections:
