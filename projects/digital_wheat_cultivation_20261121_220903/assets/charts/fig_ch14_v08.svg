  <rect x="0" y="42" width="800" height="16" fill="#312e81"/>
  <text x="22" y="27" font-size="14.5" font-weight="700" fill="#f8fafc">그림 14-8. 제14장. 디지털 트윈 및 AI 기반 밀 재배 시스템 구축 — 현장</text>
  <text x="22" y="47" font-size="11" fill="#cbd5e1">디지털 밀 재배 · 14.4 디지털 트윈을 활용한 재배 시뮬레이션 및 검증</text>
