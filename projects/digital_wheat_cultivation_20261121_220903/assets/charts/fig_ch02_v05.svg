  <text text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a"><tspan x="116" y="206.0">2.1 밀의 유전적</tspan><tspan x="116" y="224.0">다양성 및 형질 지도</tspan><tspan x="116" y="242.0">작성</tspan></text>
