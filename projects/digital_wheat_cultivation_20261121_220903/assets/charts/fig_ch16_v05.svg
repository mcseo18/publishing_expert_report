  <rect x="0" y="42" width="800" height="16" fill="#0f172a"/>
  <text x="22" y="27" font-size="14.5" font-weight="700" fill="#f8fafc">그림 16-5. 제16장. 첨단 농업의 미래와 밀 산업의 융합적 발전 방향 — 핵심</text>
