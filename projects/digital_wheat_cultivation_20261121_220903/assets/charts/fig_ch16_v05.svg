  <text x="680" y="162" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">STEP 4</text>
  <text text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a"><tspan x="680" y="206.0">16.4 연구 개발</tspan><tspan x="680" y="224.0">동향 및 미래 농업</tspan><tspan x="680" y="242.0">시스템에 대한 비판적</tspan></text>
