  <rect x="0" y="42" width="800" height="16" fill="#0f172a"/>
  <text x="22" y="27" font-size="14.5" font-weight="700" fill="#f8fafc">그림 11-5. 제11장. 세계 밀 생산 동향, 시장 구조 및 유통 시스템 — 핵심</text>
