  <rect x="0" y="42" width="800" height="16" fill="#0f172a"/>
  <text x="22" y="27" font-size="14.5" font-weight="700" fill="#f8fafc">그림 3-5. 제3장. 밀 재배를 위한 토양 과학 및 정밀 파종 기술 — 핵심 메커니즘</text>
