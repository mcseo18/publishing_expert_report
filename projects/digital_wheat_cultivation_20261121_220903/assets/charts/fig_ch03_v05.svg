  <text text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a"><tspan x="680" y="206.0">3.4 정밀 농업</tspan><tspan x="680" y="224.0">기반의 파종 장비</tspan><tspan x="680" y="242.0">운영 및 데이터 수집</tspan></text>
