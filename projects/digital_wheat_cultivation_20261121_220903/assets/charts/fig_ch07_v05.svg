  <text x="22" y="27" font-size="14.5" font-weight="700" fill="#f8fafc">그림 7-5. 제7장. 주요 병해충 및 잡초에 대한 통합적 디지털 관리 전략 — 핵심</text>
  <text x="22" y="47" font-size="11" fill="#cbd5e1">디지털 밀 재배 · 7.1 밀의 주요 곰팡이성 질병(예: 녹병) 진단 및 예측 모델</text>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/></marker></defs>
  <rect x="34" y="128" width="164" height="158" rx="10" fill="#e0f2fe" stroke="#334155" stroke-width="1.4"/>
  <text x="116" y="162" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">STEP 1</text>
  <text text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a"><tspan x="116" y="206.0">7.1 밀의 주요</tspan><tspan x="116" y="224.0">곰팡이성 질병</tspan><tspan x="116" y="242.0">녹병) 진단 및 예측</tspan></text>
