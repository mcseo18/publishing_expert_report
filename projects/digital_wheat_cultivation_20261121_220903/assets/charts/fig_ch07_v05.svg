  <text text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a"><tspan x="680" y="206.0">7.4 ICT 기반의</tspan><tspan x="680" y="224.0">예찰 시스템 구축 및</tspan><tspan x="680" y="242.0">방제 의사결정</tspan></text>
