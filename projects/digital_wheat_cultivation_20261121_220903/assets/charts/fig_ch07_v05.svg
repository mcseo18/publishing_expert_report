  <text text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a"><tspan x="492" y="206.0">7.3 잡초 생태학적</tspan><tspan x="492" y="224.0">분류 및 경쟁 강도</tspan><tspan x="492" y="242.0">평가</tspan></text>
