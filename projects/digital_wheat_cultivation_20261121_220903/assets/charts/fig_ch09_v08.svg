<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" style="background:#ffffff;font-family:'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;">
  <rect x="0" y="0" width="800" height="420" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="0" y="0" width="800" height="58" rx="12" fill="#312e81"/>
  <rect x="0" y="42" width="800" height="16" fill="#312e81"/>
  <text x="22" y="27" font-size="14.5" font-weight="700" fill="#f8fafc">그림 9-8. 제9장. 최적 수확 시기 결정 및 수확 후 품질 보존 기술 — 현장 이상</text>
  <text x="22" y="47" font-size="11" fill="#cbd5e1">디지털 밀 재배 · 9.4 저장 시설의 환경 제어(온도, 습도) 및 생물학적 안정성 확보</text>
  <rect x="40" y="88" width="345" height="135" rx="10" fill="#dcfce7" stroke="#166534" stroke-width="1.5"/>
  <text x="58" y="122" font-size="14" font-weight="700" fill="#166534">정상 · 최적 상태</text>
  <text text-anchor="start" font-size="11.8" font-weight="600" fill="#1e293b"><tspan x="58" y="150.0">9.1 등숙도 판정 지표와 수확 시기 결정</tspan><tspan x="58" y="166.0">알고리즘</tspan></text>
  <text x="58" y="202" font-size="11" fill="#475569">정량 계측 → 임계 판정 → 현장 처방</text>
  <rect x="415" y="88" width="345" height="135" rx="10" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
  <text x="433" y="122" font-size="14" font-weight="700" fill="#1e40af">예방적 디지털 모니터링</text>
  <text text-anchor="start" font-size="11.8" font-weight="600" fill="#1e293b"><tspan x="433" y="158.0">9.2 수확기 작물 수확량 예측 모델</tspan></text>
  <text x="433" y="202" font-size="11" fill="#475569">정량 계측 → 임계 판정 → 현장 처방</text>
  <rect x="40" y="245" width="345" height="135" rx="10" fill="#fef9c3" stroke="#854d0e" stroke-width="1.5"/>
  <text x="58" y="279" font-size="14" font-weight="700" fill="#854d0e">주의 · 임계치 접근</text>
  <text text-anchor="start" font-size="11.8" font-weight="600" fill="#1e293b"><tspan x="58" y="307.0">9.3 건조 과정의 열역학 및 품질 저하</tspan><tspan x="58" y="323.0">메커니즘</tspan></text>
  <text x="58" y="359" font-size="11" fill="#475569">정량 계측 → 임계 판정 → 현장 처방</text>
  <rect x="415" y="245" width="345" height="135" rx="10" fill="#fee2e2" stroke="#991b1b" stroke-width="1.5"/>
  <text x="433" y="279" font-size="14" font-weight="700" fill="#991b1b">즉각 교정 · 방제 조치</text>
  <text text-anchor="start" font-size="11.8" font-weight="600" fill="#1e293b"><tspan x="433" y="307.0">9.4 저장 시설의 환경 제어(온도, 습도)</tspan><tspan x="433" y="323.0">및 생물학적 안정성 확보</tspan></text>
  <text x="433" y="359" font-size="11" fill="#475569">정량 계측 → 임계 판정 → 현장 처방</text>
</svg>