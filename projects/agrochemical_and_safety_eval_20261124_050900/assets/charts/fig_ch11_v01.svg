  <rect x="239" y="124" width="187" height="12" fill="#009E73"/>
  <text x="332.5" y="125" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">2. 기준점(PoD) 도출</text>
  <text text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a"><tspan x="332.5" y="160.0">NOAEL 또는</tspan><tspan x="332.5" y="178.0">BMDL10</tspan><tspan x="332.5" y="196.0">모형)</tspan></text>
  <line x1="426" y1="218" x2="450" y2="218" stroke="#1D3557" stroke-width="2.2" marker-end="url(#ar)"/>
  <rect x="454" y="104" width="187" height="228" rx="10" fill="#FEF3C7" stroke="#D55E00" stroke-width="1.6"/>
