  <text x="22" y="27" font-size="14.5" font-weight="700" fill="#f8fafc">그림 11-1. OECD 포유류 독성시험 배터리에서 독성 기준점 도출 절차</text>
  <text x="22" y="47" font-size="10.8" fill="#cbd5e1">급성 6종·만성·유전·생식 독성 → NOAEL / BMDL10 결정 → 안전계수(UF ≥ 100) 적용 → ADI·ARfD·AOEL 확정</text>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 1 L 10 5 L 0 9 z" fill="#1D3557"/></marker></defs>
  <rect x="24" y="104" width="187" height="228" rx="10" fill="#E0F2FE" stroke="#0072B2" stroke-width="1.6"/>
