  <text x="547.5" y="125" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">3. 안전계수(UF) 적용</text>
  <text text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a"><tspan x="547.5" y="160.0">종간(10×) ·</tspan><tspan x="547.5" y="178.0">개체간(10×) · 추가</tspan><tspan x="547.5" y="196.0">UF · 경구흡수</tspan></text>
  <line x1="641" y1="218" x2="665" y2="218" stroke="#1D3557" stroke-width="2.2" marker-end="url(#ar)"/>
  <rect x="669" y="104" width="187" height="228" rx="10" fill="#F3E8FF" stroke="#CC79A7" stroke-width="1.6"/>
