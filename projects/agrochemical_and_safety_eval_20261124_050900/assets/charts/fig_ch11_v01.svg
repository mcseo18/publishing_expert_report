  <text text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a"><tspan x="762.5" y="160.0">ADI(만성) ·</tspan><tspan x="762.5" y="178.0">ARfD(급성) ·</tspan><tspan x="762.5" y="196.0">AOEL(작업자)</tspan></text>
  <path d="M 762 332 L 762 386 L 117 386 L 117 338" fill="none" stroke="#009E73" stroke-width="2.4" stroke-dasharray="6,4" marker-end="url(#ar)"/>
  <rect x="230" y="372" width="420" height="28" rx="14" fill="#ECFDF5" stroke="#009E73" stroke-width="1.3"/>
  <text x="440" y="390" text-anchor="middle" font-size="11.2" font-weight="700" fill="#065F46">규제 진화: 90일 개 시험 면제·NAMs 도입 | 유전독성·ED 승인 제한</text>
  <text x="22" y="458" font-size="10.2" fill="#475569">자료: 자료: [SRC-542, SRC-543, SRC-566, SRC-572, SRC-575] OECD 독성시험 체계·EFSA PoD/UF 기준치 도출 절차 통합.</text>
