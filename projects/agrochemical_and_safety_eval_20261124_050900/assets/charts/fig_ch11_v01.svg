  <text x="117.5" y="125" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">1. OECD 독성 배터리</text>
  <text text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a"><tspan x="117.5" y="160.0">급성 6종 ·</tspan><tspan x="117.5" y="178.0">90일/2년 만성 ·</tspan><tspan x="117.5" y="196.0">유전3종 · 생식</tspan></text>
