book_metadata:
  title_ko: 농약학 및 안정성 평가
  title_en: Agrochemical and safety evaluation
  target_audience: 대학 전공 심화, 대학원생, 연구자 및 선도 현장 실무자
  book_summary_ko: 본 교재는 농약화학의 기초 이론부터 유효성분의 작용기작, 제형공학, 환경 동태, 독성학적 안전성 평가 및 규제 정책에 이르기까지 농약학 전 분야를 체계적으로 집대성한 전공 심화 표준 교과서이다. 분자 수준의 생리·생화학적
    메커니즘 규명과 수학적 모형에 기반한 정량적 위해성 평가 기법을 유기적으로 연계하여 학문적 엄밀성과 포장 실무 해결 능력을 동시에 배양하도록 설계하였다. 특히 급성·만성 독성시험 데이터로부터 무작용량(NOAEL)을 도출하고 잔류허용기준(MRL),
    일일섭취허용량(ADI), 농작업자노출허용량(AOEL)을 산출하는 계산 절차와 농약관리법령 및 농촌진흥청 고시 지침을 심층 반영하였다. 이를 통해 대학 전공자, 대학원생, 농업 연구직 및 공공·민간 규제 과학 전문가가 포괄적인 독자적 전문성을 확보할
    수 있는 표준 지침을 제공한다.
  target_pages: 602
  target_total_pages: 602
  chapter_count: 14
  engine_used: Gemini (gemini-3.8-flash)
