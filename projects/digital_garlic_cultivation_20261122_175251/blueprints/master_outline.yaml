book_metadata:
  title_ko: 디지털 마늘 재배
  title_en: Digital Garlic Cultivation
  target_audience: 대학 전공 심화, 대학원생, 연구자 및 선도 현장 실무자
  book_summary_ko: 본 교재는 전통적인 마늘 재배 방식을 넘어 사물인터넷(IoT), 인공지능(AI), 컴퓨터 비전, 정밀 농기계 및 작물생육모형을 결합한 최첨단 '디지털 마늘 재배' 전 과정을 체계화한 전문 학술서입니다. 생리·생태적 특성과
    품종 분류부터 토양 수분·양분 역학, 전주기 자동화 기계화, 병해충의 딥러닝 기반 조기 진단 및 수확 후 스마트 저장 유통까지 포괄적으로 다룹니다. 총 500쪽 분량, 5개 부 15개 장으로 구성되어 대학 심화 교육, 연구개발(R&D), 스마트 노지
    실무 현장에서의 정량적 의사결정을 지원하는 표준 지침서 역할을 수행합니다.
