    title: 제15장. 디지털 마늘 재배의 경제성 평가, 탄소 배출량 및 미래 전망
    target_pages: 34
    summary_ko: 기계화·자동화 도입에 따른 생산비 절감, 노동시간 단축 및 투자수익률(ROI)을 계량경제학적으로 분석합니다. 정밀 관수·시비에 따른 농업 탄소 배출 저감 효과와 농장 디지털 트윈 기반 자율영농의 미래 청사진을 제시합니다.
