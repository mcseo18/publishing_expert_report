    title: 제14장. 스마트 건조(Curing), CA 저온저장 및 유통 품질 제어
    target_pages: 33
    summary_ko: 수확 후 부패 방지를 위한 열풍 및 제습형 스마트 건조(예건) 챔버의 온습도 제어 메커니즘을 규명합니다. 맹아 억제 및 중량 감모 최소화를 위한 CA 저장, 저온 저장고 센서 모니터링 기술과 스마트 유통 프로세스를 다룹니다.
    sections:
    - 14.1 수확 후 수분 증발 메커니즘과 차압식 스마트 예건(Curing) 시스템
    - 14.2 장기 저장을 위한 온도, 상대습도 및 기체 농도(O2, CO2) 최적 조건
    - 14.3 저장 중 맹아 억제 기작, 호흡열 분석 및 부패균 억제 센싱
    - 14.4 RFID/IoT 기반 콜드체인 추적 및 유통 단계별 품질 등급화
  - chapter_id: ch15
