chapter_id: ch13
chapter_number: 13
title: 제13장. 디지털 수확 적기 판별과 마늘 굴취·수집·절단 복합 기계화
target_pages: 33
summary_ko: 외관 지표와 생육 모델 예측치에 기반한 마늘 최적 수확 시기 결정 기준을 정량화합니다. 굴취, 흙털기, 줄기 절단, 톤백 수집을 일관화한 자주식 콤바인의 구조적 역학 및 작업 성능을 분석합니다.
sections:
- 13.1 경엽 황화율 및 구 비대 정지기 기반 수확 적기 디지털 판별
- 13.2 마늘 굴취날(Digger blade)의 진동 메커니즘과 손상률 저감 공학
- 13.3 주행 연동형 줄기 자동 절단기 및 수직 반송 이송 시스템
- 13.4 자주식 마늘 콤바인의 작업 효율성 분석 및 현장 트러블슈팅
