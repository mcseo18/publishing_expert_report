<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 476" width="880" height="476" style="background:#ffffff;font-family:'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;">
  <rect x="0" y="0" width="880" height="476" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
  <rect x="0" y="0" width="880" height="58" rx="10" fill="#1D3557"/>
  <rect x="0" y="42" width="880" height="16" fill="#1D3557"/>
  <text x="22" y="27" font-size="14.5" font-weight="700" fill="#f8fafc">그림 5-5. 양파 스마트 관개 측정 → 판단 → 밸브 제어 피드백 루프</text>
  <text x="22" y="47" font-size="10.8" fill="#cbd5e1">토양장력(Ψm)·MAD·기상 ETc·엽군온도 CWSI 융합 폐루프 자동 제어</text>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 1 L 10 5 L 0 9 z" fill="#1D3557"/></marker></defs>
  <rect x="24" y="104" width="187" height="228" rx="10" fill="#E0F2FE" stroke="#0072B2" stroke-width="1.6"/>
  <rect x="24" y="104" width="187" height="32" rx="10" fill="#0072B2"/>
  <rect x="24" y="124" width="187" height="12" fill="#0072B2"/>
  <text x="117.5" y="125" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">1. 다중 계측</text>
  <text text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a"><tspan x="117.5" y="178.0">토양(15·30cm)…</tspan></text>
  <text text-anchor="middle" font-size="10.8" font-weight="500" fill="#334155"><tspan x="117.5" y="236.5">TDR·텐시오미터 10분 계측,</tspan><tspan x="117.5" y="252.0">기상대 ET0 변수, 적외선</tspan><tspan x="117.5" y="267.5">엽군온도(Tc−Ta) 수집</tspan></text>
  <rect x="34" y="294" width="167" height="28" rx="6" fill="#ffffff" stroke="#0072B2" stroke-width="1"/>
  <text x="117.5" y="312" text-anchor="middle" font-size="10.2" font-weight="700" fill="#0072B2">주기: 10~15분</text>
  <line x1="211" y1="218" x2="235" y2="218" stroke="#1D3557" stroke-width="2.2" marker-end="url(#ar)"/>
  <text x="225.0" y="210" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1D3557">전송</text>
  <rect x="239" y="104" width="187" height="228" rx="10" fill="#DCFCE7" stroke="#009E73" stroke-width="1.6"/>
  <rect x="239" y="104" width="187" height="32" rx="10" fill="#009E73"/>
  <rect x="239" y="124" width="187" height="12" fill="#009E73"/>
  <text x="332.5" y="125" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">2. 지수 연산</text>
  <text text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a"><tspan x="332.5" y="169.0">MAD · ETc ·</tspan><tspan x="332.5" y="187.0">CWSI 동시 산출</tspan></text>
  <text text-anchor="middle" font-size="10.8" font-weight="500" fill="#334155"><tspan x="332.5" y="236.5">RAW=p·TAW</tspan><tspan x="332.5" y="252.0">ETc=Kc·ET0 및 엽군온도</tspan><tspan x="332.5" y="267.5">CWSI 산정</tspan></text>
  <rect x="249" y="294" width="167" height="28" rx="6" fill="#ffffff" stroke="#009E73" stroke-width="1"/>
  <text x="332.5" y="312" text-anchor="middle" font-size="10.2" font-weight="700" fill="#009E73">Kc: 0.70→1.05→0.75</text>
  <line x1="426" y1="218" x2="450" y2="218" stroke="#1D3557" stroke-width="2.2" marker-end="url(#ar)"/>
  <text x="440.0" y="210" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1D3557">비교</text>
  <rect x="454" y="104" width="187" height="228" rx="10" fill="#FEF3C7" stroke="#D55E00" stroke-width="1.6"/>
  <rect x="454" y="104" width="187" height="32" rx="10" fill="#D55E00"/>
  <rect x="454" y="124" width="187" height="12" fill="#D55E00"/>
  <text x="547.5" y="125" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">3. 임계 판정</text>
  <text text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a"><tspan x="547.5" y="169.0">관수 개시 및 강우</tspan><tspan x="547.5" y="187.0">인터록</tspan></text>
  <text text-anchor="middle" font-size="10.8" font-weight="500" fill="#334155"><tspan x="547.5" y="228.8">Ψm≤−20 kPa 또는</tspan><tspan x="547.5" y="244.2">MAD≥25% 또는</tspan><tspan x="547.5" y="259.8">CWSI≥0.30 시 개시</tspan><tspan x="547.5" y="275.2">예보 시 보류)</tspan></text>
  <rect x="464" y="294" width="167" height="28" rx="6" fill="#ffffff" stroke="#D55E00" stroke-width="1"/>
  <text x="547.5" y="312" text-anchor="middle" font-size="10.2" font-weight="700" fill="#D55E00">30cm 과습 차단</text>
  <line x1="641" y1="218" x2="665" y2="218" stroke="#1D3557" stroke-width="2.2" marker-end="url(#ar)"/>
  <text x="655.0" y="210" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1D3557">구동</text>
  <rect x="669" y="104" width="187" height="228" rx="10" fill="#F3E8FF" stroke="#CC79A7" stroke-width="1.6"/>
  <rect x="669" y="104" width="187" height="32" rx="10" fill="#CC79A7"/>
  <rect x="669" y="124" width="187" height="12" fill="#CC79A7"/>
  <text x="762.5" y="125" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">4. 밸브 제어</text>
  <text text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a"><tspan x="762.5" y="169.0">솔레노이드 밸브 펄스</tspan><tspan x="762.5" y="187.0">관수</tspan></text>
  <text text-anchor="middle" font-size="10.8" font-weight="500" fill="#334155"><tspan x="762.5" y="236.5">목표 조관수량(RAW/EU)</tspan><tspan x="762.5" y="252.0">분할 공급 및 유량·압력계로</tspan><tspan x="762.5" y="267.5">EU≥90% 감시</tspan></text>
  <rect x="679" y="294" width="167" height="28" rx="6" fill="#ffffff" stroke="#CC79A7" stroke-width="1"/>
  <text x="762.5" y="312" text-anchor="middle" font-size="10.2" font-weight="700" fill="#CC79A7">종료: Ψm≥−10 kPa</text>
  <path d="M 762 332 L 762 386 L 117 386 L 117 338" fill="none" stroke="#009E73" stroke-width="2.4" stroke-dasharray="6,4" marker-end="url(#ar)"/>
  <rect x="230" y="372" width="420" height="28" rx="14" fill="#ECFDF5" stroke="#009E73" stroke-width="1.3"/>
  <text x="440" y="390" text-anchor="middle" font-size="11.2" font-weight="700" fill="#065F46">관수 후 15·30 cm 센서 재계측 → 포장용수량(−10 kPa) 복귀 시 밸브 차단</text>
  <text x="22" y="458" font-size="10.2" fill="#475569">자료: Idso et al. (1981) CWSI 모형, FAO-56 MAD(p=0.25–0.30) 기준 및 본문 5.4절 폐루프 제어 알고리즘</text>
</svg>