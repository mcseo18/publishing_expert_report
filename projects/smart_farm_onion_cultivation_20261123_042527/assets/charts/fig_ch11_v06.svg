  <text text-anchor="start" font-size="11.5" font-weight="700" fill="#1e293b"><tspan x="24" y="252.5">11.3 3차원 근계 스캐닝</tspan><tspan x="24" y="267.5">및 엽면적 비파괴 계측을 통한</tspan></text>
