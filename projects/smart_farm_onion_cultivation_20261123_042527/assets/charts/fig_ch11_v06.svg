  <text x="22" y="27" font-size="14.5" font-weight="700" fill="#f8fafc">그림 11-6. 제11장. 양파 육묘 공정의 전주기 스마트 환경 제어 및 묘소질 진단</text>
  <text x="22" y="47" font-size="11" fill="#cbd5e1">스마트 팜 양파 재배 · 11.2 묘의 도장 방지 및 충실도 향상을 위한 물리적 자극과 스마트 LED 보광 스펙트럼</text>
  <text text-anchor="start" font-size="11.5" font-weight="700" fill="#1e293b"><tspan x="24" y="104.5">11.1 우량 묘 생산을 위한</tspan><tspan x="24" y="119.5">플러그 육묘장 환경</tspan></text>
