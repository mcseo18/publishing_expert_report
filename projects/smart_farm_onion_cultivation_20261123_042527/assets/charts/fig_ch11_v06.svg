  <text text-anchor="start" font-size="11.5" font-weight="700" fill="#1e293b"><tspan x="24" y="326.5">11.4 트레이 자동 이송 및</tspan><tspan x="24" y="341.5">이미지 판별 기반 불량 묘</tspan></text>
