  <text text-anchor="start" font-size="11.5" font-weight="700" fill="#1e293b"><tspan x="24" y="178.5">11.2 묘의 도장 방지 및</tspan><tspan x="24" y="193.5">충실도 향상을 위한 물리적</tspan></text>
  <rect x="270" y="172" width="420" height="28" rx="6" fill="#f1f5f9"/>
