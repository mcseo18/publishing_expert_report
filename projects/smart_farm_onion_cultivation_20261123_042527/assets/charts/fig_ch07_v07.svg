<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" style="background:#ffffff;font-family:'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;">
  <rect x="0" y="0" width="800" height="420" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="0" y="0" width="800" height="58" rx="12" fill="#1e293b"/>
  <rect x="0" y="42" width="800" height="16" fill="#1e293b"/>
  <text x="22" y="27" font-size="14.5" font-weight="700" fill="#f8fafc">그림 7-7. 제7장. 디지털 트윈과 양파 생육·수율 시뮬레이션 모델링 — 단계별</text>
  <text x="22" y="47" font-size="11" fill="#cbd5e1">스마트 팜 양파 재배 · 7.3 UAV 초분광 영상 및 정규식생지수를 활용한 실시간 생육량 보정</text>
  <line x1="70" y1="228" x2="730" y2="228" stroke="#0284c7" stroke-width="4"/>
  <circle cx="115" cy="228" r="22" fill="#0284c7" stroke="#ffffff" stroke-width="3"/>
  <text x="115" y="233" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">S1</text>
  <rect x="31" y="96" width="168" height="86" rx="8" fill="#f8fafc" stroke="#0284c7" stroke-width="1.5"/>
  <text text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a"><tspan x="115" y="123.0">7.1 작물 생장</tspan><tspan x="115" y="139.0">시뮬레이션 엔진 구조와</tspan><tspan x="115" y="155.0">양파 특화 유전 모수</tspan></text>
  <text x="115" y="286" text-anchor="middle" font-size="11" fill="#475569">핵심 지표 계측 · 검증</text>
  <circle cx="305" cy="228" r="22" fill="#0d9488" stroke="#ffffff" stroke-width="3"/>
  <text x="305" y="233" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">S2</text>
  <rect x="221" y="96" width="168" height="86" rx="8" fill="#f8fafc" stroke="#0d9488" stroke-width="1.5"/>
  <text text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a"><tspan x="305" y="123.0">7.2 광합성 유효</tspan><tspan x="305" y="139.0">방사(PAR) 차단율과</tspan><tspan x="305" y="155.0">광이용효율(RUE)에</tspan></text>
  <text x="305" y="286" text-anchor="middle" font-size="11" fill="#475569">핵심 지표 계측 · 검증</text>
  <circle cx="495" cy="228" r="22" fill="#16a34a" stroke="#ffffff" stroke-width="3"/>
  <text x="495" y="233" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">S3</text>
  <rect x="411" y="96" width="168" height="86" rx="8" fill="#f8fafc" stroke="#16a34a" stroke-width="1.5"/>
  <text text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a"><tspan x="495" y="123.0">7.3 UAV 초분광</tspan><tspan x="495" y="139.0">영상 및 정규식생지수를</tspan><tspan x="495" y="155.0">활용한 실시간 생육량</tspan></text>
  <text x="495" y="286" text-anchor="middle" font-size="11" fill="#475569">핵심 지표 계측 · 검증</text>
  <circle cx="685" cy="228" r="22" fill="#7c3aed" stroke="#ffffff" stroke-width="3"/>
  <text x="685" y="233" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">S4</text>
  <rect x="601" y="96" width="168" height="86" rx="8" fill="#f8fafc" stroke="#7c3aed" stroke-width="1.5"/>
  <text text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a"><tspan x="685" y="123.0">7.4 가상 포장</tspan><tspan x="685" y="139.0">디지털 트윈을 통한</tspan><tspan x="685" y="155.0">포장 균일도 평가 및</tspan></text>
  <text x="685" y="286" text-anchor="middle" font-size="11" fill="#475569">핵심 지표 계측 · 검증</text>
</svg>