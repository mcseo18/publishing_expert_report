<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" style="background:#ffffff;font-family:'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;">
  <rect x="0" y="0" width="800" height="420" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="0" y="0" width="800" height="58" rx="12" fill="#0f2942"/>
  <rect x="0" y="42" width="800" height="16" fill="#0f2942"/>
  <text x="22" y="27" font-size="14.5" font-weight="700" fill="#f8fafc">그림 13-6. 제13장. 스마트 건조(Curing)와 CA/저온 저장 환경 최적화</text>
  <text x="22" y="47" font-size="11" fill="#cbd5e1">스마트 팜 양파 재배 · 13.2 에너지 고효율 스마트 건조 챔버의 복합 열원(열펌프, 외기 도입) 자동 제어 알고리즘</text>
  <text text-anchor="start" font-size="11.5" font-weight="700" fill="#1e293b"><tspan x="24" y="104.5">13.1 수확 후 인경의</tspan><tspan x="24" y="119.5">큐어링(Curing) 생리:</tspan></text>
  <rect x="270" y="98" width="420" height="28" rx="6" fill="#f1f5f9"/>
  <rect x="270" y="98" width="377" height="28" rx="6" fill="#0284c7"/>
  <text x="655" y="117" font-size="12" font-weight="700" fill="#0f172a">92%</text>
  <text text-anchor="start" font-size="11.5" font-weight="700" fill="#1e293b"><tspan x="24" y="178.5">13.2 에너지 고효율 스마트</tspan><tspan x="24" y="193.5">건조 챔버의 복합</tspan></text>
  <rect x="270" y="172" width="420" height="28" rx="6" fill="#f1f5f9"/>
  <rect x="270" y="172" width="344" height="28" rx="6" fill="#16a34a"/>
  <text x="622" y="191" font-size="12" font-weight="700" fill="#0f172a">84%</text>
  <text text-anchor="start" font-size="11.5" font-weight="700" fill="#1e293b"><tspan x="24" y="252.5">13.3 양파 장기 저장을</tspan><tspan x="24" y="267.5">위한 CA 저장 환경</tspan></text>
  <rect x="270" y="246" width="420" height="28" rx="6" fill="#f1f5f9"/>
  <rect x="270" y="246" width="311" height="28" rx="6" fill="#d97706"/>
  <text x="589" y="265" font-size="12" font-weight="700" fill="#0f172a">76%</text>
  <text text-anchor="start" font-size="11.5" font-weight="700" fill="#1e293b"><tspan x="24" y="326.5">13.4 저장 중 생체중량</tspan><tspan x="24" y="341.5">감모, 부패, 조기 맹아 발생</tspan></text>
  <rect x="270" y="320" width="420" height="28" rx="6" fill="#f1f5f9"/>
  <rect x="270" y="320" width="278" height="28" rx="6" fill="#7c3aed"/>
  <text x="556" y="339" font-size="12" font-weight="700" fill="#0f172a">68%</text>
</svg>