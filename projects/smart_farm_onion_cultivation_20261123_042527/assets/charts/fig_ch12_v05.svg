  <text text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a"><tspan x="304" y="206.0">12.2 고속 전자동</tspan><tspan x="304" y="224.0">양파 정식기의 묘</tspan><tspan x="304" y="242.0">취출-천공-복토</tspan></text>
  <line x1="386" y1="208" x2="410" y2="208" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="410" y="128" width="164" height="158" rx="10" fill="#fef3c7" stroke="#334155" stroke-width="1.4"/>
