  <text text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a"><tspan x="492" y="206.0">12.3 줄기 절단</tspan><tspan x="492" y="224.0">및 굴취 수집 일관</tspan><tspan x="492" y="242.0">수확기의 동역학</tspan></text>
  <line x1="574" y1="208" x2="598" y2="208" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="598" y="128" width="164" height="158" rx="10" fill="#f3e8ff" stroke="#334155" stroke-width="1.4"/>
