  <text text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a"><tspan x="680" y="206.0">12.4 수확 동시</tspan><tspan x="680" y="224.0">포장 내 등급 판별</tspan><tspan x="680" y="242.0">및 인경 크기·중량</tspan></text>
