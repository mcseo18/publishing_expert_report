<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" style="background:#ffffff;font-family:'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;">
  <rect x="0" y="0" width="800" height="420" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="0" y="0" width="800" height="58" rx="12" fill="#0f172a"/>
  <rect x="0" y="42" width="800" height="16" fill="#0f172a"/>
  <text x="22" y="27" font-size="14.5" font-weight="700" fill="#f8fafc">그림 14-1. 제14장. 양파 비파괴 선별 및 유통 디지털 트레이서빌리티 — 현장</text>
  <text x="22" y="47" font-size="11" fill="#cbd5e1">스마트 팜 양파 재배 · 14.1 근적외선(NIR) 분광분석을 이용한 양파 내부 부패, 당도, 피루브산(매운맛) 비파괴 고속 선별</text>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/></marker></defs>
  <rect x="34" y="128" width="164" height="158" rx="10" fill="#e0f2fe" stroke="#334155" stroke-width="1.4"/>
  <text x="116" y="162" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">STEP 1</text>
  <text text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a"><tspan x="116" y="206.0">14.1</tspan><tspan x="116" y="224.0">근적외선(NIR)</tspan><tspan x="116" y="242.0">분광분석을 이용한</tspan></text>
  <line x1="198" y1="208" x2="222" y2="208" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="222" y="128" width="164" height="158" rx="10" fill="#dcfce7" stroke="#334155" stroke-width="1.4"/>
  <text x="304" y="162" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">STEP 2</text>
  <text text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a"><tspan x="304" y="206.0">14.2 인공지능</tspan><tspan x="304" y="224.0">기반 다채널 영상</tspan><tspan x="304" y="242.0">선별기의 외관</tspan></text>
  <line x1="386" y1="208" x2="410" y2="208" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="410" y="128" width="164" height="158" rx="10" fill="#fef3c7" stroke="#334155" stroke-width="1.4"/>
  <text x="492" y="162" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">STEP 3</text>
  <text text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a"><tspan x="492" y="206.0">14.3 스마트</tspan><tspan x="492" y="224.0">산지유통센터(APC)</tspan><tspan x="492" y="242.0">물류 자동화와 AGV</tspan></text>
  <line x1="574" y1="208" x2="598" y2="208" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="598" y="128" width="164" height="158" rx="10" fill="#f3e8ff" stroke="#334155" stroke-width="1.4"/>
  <text x="680" y="162" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">STEP 4</text>
  <text text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a"><tspan x="680" y="206.0">14.4 블록체인</tspan><tspan x="680" y="224.0">기반 생산 이력·재배</tspan><tspan x="680" y="242.0">이력 및 저온 유통망</tspan></text>
  <text x="400" y="348" text-anchor="middle" font-size="11" fill="#64748b">실사진/도해 생성 프롬프트 준비됨 (fal.ai 또는 나노바나나 API 키 활성화 시 실사 PNG 자동 대체)</text>
</svg>