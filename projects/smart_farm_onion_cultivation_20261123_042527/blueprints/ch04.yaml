chapter_id: ch04
chapter_number: 4
title: 제4장. 정밀 양파 재배를 위한 스마트 토양 물리·화학성 평가 및 작부체계
target_pages: 33
summary_ko: 양파 뿌리권의 발달을 촉진하는 물리적 삼상 분포, 투수성, 토양 전도도(EC) 및 pH의 정량적 임계 한계를 규명하고 다분광 센서 기반 토양 맵핑을 학습합니다. 벼, 콩, 사료작물과의 윤작 및 녹비작물 투입이 토양 지력 회복과 선충
  억제에 미치는 영향을 데이터 기반으로 실증합니다.
sections:
- 4.1 양파 근계 발달을 위한 최적 토양 물리성(공극률, 가비중, 용수량)과 토층 개량 기술
- 4.2 토양 pH(6.0~6.8) 및 염류집적도(EC)가 미량원소 흡수와 뿌리 활력에 미치는 영향
- 4.3 다분광·초분광 토양 센서를 활용한 포장 내 물리화학성 공간 변이성 매핑 기법
- 4.4 토양 전염성 병원균 저감 및 지력 증진을 위한 데이터 기반 고수익 작부체계 설계
