chapter_id: ch13
chapter_number: 13
title: 제13장. 스마트 건조(Curing)와 CA/저온 저장 환경 최적화 제어
target_pages: 34
summary_ko: 수확 후 부패율 저감을 위한 스마트 송풍 건조(Curing) 챔버의 열·수분 수지 모델과 다단계 습도 감응 제어 프로세스를 구축합니다. 맹아 및 호흡 억제를 위한 저온·CA(Controlled Atmosphere) 저장고 내 산소,
  이산화탄소, 에틸렌 농도의 동적 정밀 제어 기법을 실증합니다.
sections:
- '13.1 수확 후 인경의 큐어링(Curing) 생리: 외피 건조 메커니즘과 네크 썩음병균 침입 차단막 형성'
- 13.2 에너지 고효율 스마트 건조 챔버의 복합 열원(열펌프, 외기 도입) 자동 제어 알고리즘
- 13.3 양파 장기 저장을 위한 CA 저장 환경(O2 1~2%, CO2 3~5%, 저온 0℃, 습도 70%) 최적화
- 13.4 저장 중 생체중량 감모, 부패, 조기 맹아 발생 모니터링을 위한 IoT 가스·온습도 센서망
