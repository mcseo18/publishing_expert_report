chapter_id: ch03
chapter_number: 3
title: 제3장. 양파의 생육 단계별 생리 기작과 인경 비대 메커니즘
target_pages: 34
summary_ko: 종자 발아부터 엽초 발달, 인경 형성 유도, 도복 및 휴면에 이르는 전주기 생리 단계별 호르몬 상호작용과 탄소 동화산물 전위 경로를 다룹니다. 특히 한계 일장 및 임계 온도 노출에 따른 광유도 피토크롬 신호전달계와 불시 추대(Bolting),
  분구(Splitting)의 발생 기작을 정밀 해석합니다.
sections:
- '3.1 맹아, 본엽 전개 및 뿌리 생장 다이내믹스: 옥신-시토키닌 호르몬 상호작용'
- 3.2 일장 감응과 FT-homolog 유전자 발현을 통한 인경 팽창 신호전달 캐스케이드
- 3.3 저온 노출 기간(Vernalization)과 유효 적산온도에 따른 불시 추대 생리 모델
- 3.4 도복(Lodging) 전후 광합성 산물의 재분배 효율과 인경 성숙·내재적 휴면 진입
