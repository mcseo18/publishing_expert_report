chapter_id: ch02
chapter_number: 2
title: 제2장. 양파의 식물학적 분류체계와 스마트 팜 맞춤형 품종 특성
target_pages: 33
summary_ko: 식물학적 형태 형성과 일장·온도 감응성에 기반한 단일·중일·장일형 품종군 분류 체계를 구명하고 기계화·스마트 팜 적합 품종의 특성을 분석합니다. 디지털 제어 환경과 무인 정식·수확 기계화에 최적화된 초형, 인경 균일도, 피막성 및 저장성
  지표를 정량적으로 제시합니다.
sections:
- 2.1 Allium속의 계통분류학적 위치와 유전체(Genome) 구성을 통한 품종군 분화
- 2.2 단일계·중일계·장일계 품종의 감온·감광성 반응 특성과 지리적 분포 한계
- 2.3 노지 스마트 팜 기계화 적합 초형(직립성, 엽각) 및 인경 특성(구형 지수, 피막 강도)
- 2.4 시설 차광 및 보광 재배를 위한 고기능성 다수확 양파 품종 선발 기준
