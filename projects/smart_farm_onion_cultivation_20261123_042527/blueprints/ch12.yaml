chapter_id: ch12
chapter_number: 12
title: 제12장. 자율주행 기반 정식·포장관리 및 지능형 수확 로봇
target_pages: 33
summary_ko: RTK-GNSS 기반 센티미터급 정밀 자율주행 양파 자동 정식기의 작동 메커니즘과 포장 주행 제어 경로 생성 기법을 학습합니다. 굴취, 줄기 절단, 인경 손상 최소화 수집을 자율적으로 수행하는 지능형 수확 머신과 비전 센서 기반 실시간
  손실 모니터링 기술을 다룹니다.
sections:
- 12.1 RTK-GNSS 및 슬램(SLAM) 기반 노지 자율주행 플랫폼의 포장 주행선 추종 제어 알고리즘
- 12.2 고속 전자동 양파 정식기의 묘 취출-천공-복토 메커니즘과 정식 심도 일정화 유압 제어
- 12.3 줄기 절단 및 굴취 수집 일관 수확기의 동역학 해석과 외피 충격 최소화 완충 설계
- 12.4 수확 동시 포장 내 등급 판별 및 인경 크기·중량 맵핑을 위한 온보드 컴퓨터 비전
