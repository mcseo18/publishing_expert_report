chapter_id: ch08
chapter_number: 8
title: 제8장. 기상 이변에 따른 생리장해 원인 분석 및 스마트 제어 기술
target_pages: 33
summary_ko: 이상 고온, 가뭄, 습해, 동해 등 기후변화 리스크로 인해 발생하는 생리장해(쌍구, 열과, 중심부 공동화, 붕소·칼슘 결핍)의 유발 기작을 구명합니다. 미기상 센서 데이터와 연동된 스프링클러 미스트 냉각, 스마트 배수 밸브 가동 등
  실시간 완화 제어 전략을 정립합니다.
sections:
- 8.1 고온·건조 조건 하에서의 칼슘 이동 제한과 엽선괴사(Tip-burn) 및 중심부 갈변 기작
- 8.2 월동기 동해·서릿발 피해 발생 조건과 토양 멀칭(생분해성 필름) 보온 계측 제어
- 8.3 생육 후기 과습 조건에 의한 뿌리 질식, 열과(Cracking) 발생 및 지하배수 스마트 밸브 제어
- 8.4 포장 미기상(초근접 온도, 포화차 VPD) 모니터링을 통한 생리장해 조기 경보 및 자동 분무 완화
