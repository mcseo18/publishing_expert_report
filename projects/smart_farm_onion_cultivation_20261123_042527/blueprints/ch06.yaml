chapter_id: ch06
chapter_number: 6
title: 제6장. 정밀 관비(Fertigation) 시스템과 실시간 양분 모니터링
target_pages: 34
summary_ko: 질소, 인산, 칼륨, 칼슘, 황 등 주요 필수 원소의 흡수 동역학을 분석하고 생육 단계별 최적 N-P-K-Ca 비료 배합 및 점적관비 처방 기준을 정량화합니다. 토양 용액 추출 센서(Suction lysimeter) 및 근적외선 분광을
  활용한 엽내 질산태 질소 실시간 모니터링 체계를 소개합니다.
sections:
- 6.1 양파 주요 생육 단계별 필수 다량원소(N, P, K, Ca, Mg, S) 흡수 패턴 및 체내 이동성
- '6.2 생육 시기별 실시간 정밀 관비 처방 모델: 기비-추비 비율 분할 및 시비 농도(EC) 제어'
- 6.3 토양 용액 센싱 및 비파괴 엽록소(SPAD)/엽내 질소 분광 센서를 활용한 영양 진단
- 6.4 스마트 관비 믹서(Venturi, Proportional pump)의 제어 로직과 비료 용해도·침전 방지 기술
