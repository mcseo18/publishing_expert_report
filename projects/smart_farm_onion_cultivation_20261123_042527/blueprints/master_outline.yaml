  title: 제5부. 전과정 디지털화·품질 표준화 및 미래 농업 플랫폼
  pages: 67
  chapters:
  - chapter_id: ch14
    chapter_number: 14
    title: 제14장. 양파 비파괴 선별 및 유통 디지털 트레이서빌리티
    target_pages: 33
    summary_ko: 초음파, 근적외선(NIR), X선 컴퓨터 단층촬영(CT) 기술을 응용한 양파 내부 중심부 부패 및 당도 비파괴 정밀 판별 장치를 다룹니다. 생산부터 유통, 소비 단계까지 농산물 이력 데이터를 무결하게 연결하는 블록체인 및 RFID
      콜드체인 추적 시스템을 설계합니다.
    sections:
    - 14.1 근적외선(NIR) 분광분석을 이용한 양파 내부 부패, 당도, 피루브산(매운맛) 비파괴 고속 선별
    - 14.2 인공지능 기반 다채널 영상 선별기의 외관 등급(외경, 착색도, 외피 결점) 실시간 분류
    - 14.3 스마트 산지유통센터(APC) 물류 자동화와 AGV 기반 팔레타이징 최적 동선 제어
    - 14.4 블록체인 기반 생산 이력·재배 이력 및 저온 유통망(Cold chain) 모니터링 시스템 구축
  - chapter_id: ch15
    chapter_number: 15
    title: 제15장. 노지 스마트 팜 데이터 표준화 및 지속가능한 디지털 농업 플랫폼
    target_pages: 34
    summary_ko: 포장 센서, 기상 관측망, 농기계 텔레매틱스(ISOBUS) 데이터의 국가·국제 표준 규격(ISO 11783) 통합과 클라우드 데이터 파이프라인을 구축합니다. 양파 생산-공급망 전주기 탄소 발자국 평가(LCA)와 생성형 AI 기반
      농가 맞춤형 영농 의사결정 지원 플랫폼의 미래 모델을 제시합니다.
    sections:
    - 15.1 노지 스마트 팜 센서-액추에이터 인터페이스 및 농기계 텔레매틱스(ISOBUS) 데이터 표준화
    - 15.2 이종 농업 데이터(위성, 기상, 센서, 생육) 수집·통합을 위한 클라우드 빅데이터 아키텍처
    - 15.3 비료·에너지 투입 절감에 따른 전과정 환경영향평가(LCA) 및 저탄소 농업 인증 프로토콜
    - 15.4 거대언어모델(LLM)과 농업 온톨로지 기반 전주기 영농 의사결정 지원 서비스(FEMS)의 미래
