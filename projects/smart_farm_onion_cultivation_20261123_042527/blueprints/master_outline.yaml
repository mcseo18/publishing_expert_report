book_metadata:
  title_ko: 스마트 팜 양파 재배
  title_en: Smart Farm Onion Cultivation
  target_audience: 대학 전공 심화, 대학원생, 연구자 및 선도 현장 실무자
  book_summary_ko: 본 교재는 기후변화와 농촌 고령화에 대응하여 양파(Allium cepa L.) 산업의 지속가능성과 생산성을 극대화하기 위한 스마트 팜 기반 전주기 재배 표준 지침서입니다. 기초 식물학적 특성과 유전자원 분포, 생육 단계별
    환경 반응 생리에서부터 노지·시설 스마트 팜의 센서 계측, 정밀 수분·양분 공급 알고리즘, 병해충·생리장해 AI 예찰 시스템을 심도 있게 다룹니다. 나아가 무인 자동화 농작업 기계화, 수확 후 CA 저장 관리 및 디지털 트윈 기반 전과정 데이터 통합
    체계를 아우름으로써 대학 전공 심화 과정, 대학원생, 농업 연구자 및 첨단 영농 실무자에게 학술적 깊이와 현장 적용성을 동시에 제공합니다.
