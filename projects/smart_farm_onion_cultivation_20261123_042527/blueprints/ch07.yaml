chapter_id: ch07
chapter_number: 7
title: 제7장. 디지털 트윈과 양파 생육·수율 시뮬레이션 모델링
target_pages: 33
summary_ko: DSSAT, CropSyst 등 기작 중심 작물 생육 모델을 양파에 적용하여 일사량, 온도, 수분, 양분 조건에 따른 인경 비대와 바이오매스 축적 과정을 시뮬레이션합니다. 드론 및 근접 센싱 영상 데이터를 융합한 디지털 트윈 플랫폼을
  통해 수확기 수율 및 출하 규격을 사전에 정밀 예측합니다.
sections:
- 7.1 작물 생장 시뮬레이션 엔진 구조와 양파 특화 유전 모수(Genetic coefficients) 보정
- 7.2 광합성 유효 방사(PAR) 차단율과 광이용효율(RUE)에 기초한 건물중 분배 모델링
- 7.3 UAV 초분광 영상 및 정규식생지수(NDVI/NDRE)를 활용한 실시간 생육량 보정(Data Assimilation)
- 7.4 가상 포장 디지털 트윈을 통한 포장 균일도 평가 및 최종 구 크기별 수확량 예측
