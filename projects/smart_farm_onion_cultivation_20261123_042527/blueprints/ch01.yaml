chapter_id: ch01
chapter_number: 1
title: 제1장. 양파의 기원, 진화와 국내외 산업 생태계 현황
target_pages: 33
summary_ko: 유라시아 스텝 지대 기원의 양파 야생종 분화 과정과 유전자원 보존 현황을 분석하고, 글로벌 생산 벨트와 한국 양파 산업의 수급 체계 및 스마트 농업 전환 당위성을 규명합니다. 주요 수출입국의 생산 통계 지표와 기후변화에 따른 재배적지
  이동 모델을 정량적으로 해석하여 미래 산업 발전 전략을 도출합니다.
sections:
- 1.1 양파(Allium cepa L.)의 기원 중심지와 중앙아시아 스텝 지대 야생 근연종의 진화 경로
- 1.2 전 세계 파속 유전자원의 수집·보존(In-situ/Ex-situ) 및 지속가능한 농업을 위한 유전적 다변화
- 1.3 글로벌 양파 생산 벨트(아시아, 북미, 유럽)의 재배 면적, 단수 및 교역 동향 분석
- 1.4 국내 양파 산업의 구조적 취약성(노동력 집약, 수급 불안정)과 스마트 팜 도입의 필연성
