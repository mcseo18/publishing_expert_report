chapter_id: ch05
chapter_number: 5
title: 제5장. 토양 수분 모니터링 센서 네트워크와 스마트 관개 자동화
target_pages: 33
summary_ko: TDR, FDR 및 텐시오미터 기반의 실시간 토양 수분 장력 계측 체계와 작물 증발산량(ETc) 산정 모델을 결합한 지능형 관개 제어 알고리즘을 구축합니다. 생육 초기 활착기부터 인경 비대기, 수확 전 단수기까지 토양 수분 포화도 제어를
  통한 열과 방지 및 생산성 극대화 방안을 다룹니다.
sections:
- 5.1 FDR/TDR 센서 및 텐시오미터(Tensiometer)의 원리, 보정 계수 및 설치 프로토콜
- 5.2 기상 데이터(온·습도, 일사량, 풍속) 기반 Penman-Monteith 작물 증발산량(ETc) 산출
- 5.3 점적 관개(Drip irrigation) 시스템의 수리학적 설계와 포장 내 관수 균일도(CU) 평가
- 5.4 토양 수분 결핍 지수(CWSI) 기반 무인 밸브 연동 자동 관개 알고리즘 구현
