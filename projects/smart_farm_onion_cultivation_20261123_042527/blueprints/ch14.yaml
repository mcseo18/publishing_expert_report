chapter_id: ch14
chapter_number: 14
title: 제14장. 양파 비파괴 선별 및 유통 디지털 트레이서빌리티
target_pages: 33
summary_ko: 초음파, 근적외선(NIR), X선 컴퓨터 단층촬영(CT) 기술을 응용한 양파 내부 중심부 부패 및 당도 비파괴 정밀 판별 장치를 다룹니다. 생산부터 유통, 소비 단계까지 농산물 이력 데이터를 무결하게 연결하는 블록체인 및 RFID 콜드체인
  추적 시스템을 설계합니다.
sections:
- 14.1 근적외선(NIR) 분광분석을 이용한 양파 내부 부패, 당도, 피루브산(매운맛) 비파괴 고속 선별
- 14.2 인공지능 기반 다채널 영상 선별기의 외관 등급(외경, 착색도, 외피 결점) 실시간 분류
- 14.3 스마트 산지유통센터(APC) 물류 자동화와 AGV 기반 팔레타이징 최적 동선 제어
- 14.4 블록체인 기반 생산 이력·재배 이력 및 저온 유통망(Cold chain) 모니터링 시스템 구축
