parts:
- part_number: 1
  title: 제1부. 고구마의 생리학적 특성 및 재배 환경 최적화
  pages: 100
  chapters:
  - chapter_id: ch01
    chapter_number: 1
    title: 제1장. 고구마의 분류학적 이해와 생리적 특성
    target_pages: 50
    summary_ko: 고구마의 식물학적 특성과 괴근 발달의 생리학적 기작을 심층적으로 다룹니다. 다양한 품종별 특성(당분 축적, 저장성 등)을 분석하여 재배 목표에 맞는 품종 선택의 이론적 근거를 제시합니다.
    sections:
    - 1.1 메꽃과(Convolvulaceae)의 특징과 고구마의 계통
    - 1.2 괴근(Tuberous Root) 형성 메커니즘 및 비대 원리
    - 1.3 호온성(Thermophilous) 작물로서의 생장 특성
    - '1.4 품종별 특성 분석: 밤고구마, 호박고구마, 꿀고구마의 비교'
  - chapter_id: ch02
    chapter_number: 2
    title: 제2장. 토양학적 환경과 재배 기초 기술
    target_pages: 50
    summary_ko: 고구마 생육에 필수적인 토양 조건과 환경 인자를 정량적으로 분석합니다. 건강한 초기 식재료(씨고구마, 무병묘) 확보 및 최적의 초기 식재(심경, 이랑) 기술을 현장 적용 관점에서 상세히 다룹니다.
    sections:
    - 2.1 고구마 생육에 적합한 토양 특성 (사질양토 중심)
    - '2.2 최적의 재배 환경 조건: 온도, 습도, 광량'
    - '2.3 재배 준비: 씨고구마 선별 및 무병묘 생산 기술'
    - '2.4 초기 재식 방법: 심경, 이랑 조성 및 수평심기 원리'
- part_number: 2
  title: 제2부. 초기 생육 단계 관리 및 생장 촉진 기술
  pages: 100
  chapters:
  - chapter_id: ch03
    chapter_number: 3
    title: 제3장. 활착기 및 초기 생육 관리
    target_pages: 50
    summary_ko: 묘목이 토양에 정착하고 초기 생육을 시작하는 단계의 핵심 관리 포인트를 다룹니다. 비료의 종류와 시비 시기, 그리고 환경 제어(온상, 멀칭)를 통한 초기 생육 안정화 방안을 제시합니다.
    sections:
    - 3.1 정식 및 활착 과정의 생리적 반응
    - '3.2 초기 생장 단계의 영양 공급: 가리질 비료 시비 전략'
    - 3.3 재식 밀도 결정과 덩굴 발달 최적화
    - '3.4 초기 생장 환경 제어: 전열온상 및 비닐 멀칭 적용'
  - chapter_id: ch04
    chapter_number: 4
    title: 제4장. 덩굴 생장 조절 및 생육 최적화 기법
    target_pages: 50
    summary_ko: 고구마 덩굴의 무성한 생장을 효율적으로 관리하고 수확량을 극대화하는 기술을 집중적으로 다룹니다. 덩굴의 방향 제어, 밀도 조절 등 물리적 관리 기법을 심도 있게 다룹니다.
    sections:
    - 4.1 덩굴무성(Vigorous Growth)의 유도 및 관리
    - '4.2 덩굴의 형태 제어 기술: 덩굴 뒤집기 및 지지체 활용'
    - 4.3 생장 조절을 위한 재식 밀도 및 포기 간격 설정
    - 4.4 병해충 예방적 생육 관리 (예방적 방제 전략)
- part_number: 3
  title: 제3부. 괴근 비대 및 품질 향상 메커니즘
  pages: 100
  chapters:
  - chapter_id: ch05
    chapter_number: 5
    title: 제5장. 괴근 형성 및 비대 과정의 분자생물학적 이해
    target_pages: 50
    summary_ko: 괴근이 형성되고 비대해지는 과정에 관여하는 생화학적, 분자생물학적 메커니즘을 최신 연구를 기반으로 설명합니다. 특히 당분 저장 및 효소 작용에 초점을 맞춥니다.
    sections:
    - 5.1 괴근 형성 유도 요인과 발달 시기
    - 5.2 괴근 비대(Tuberous Root Enlargement)를 조절하는 호르몬 및 유전자
    - '5.3 당분 축적 메커니즘: 전분 및 당화 효소 연구 (Isoamylase 등)'
    - '5.4 최신 연구 동향: 전사체 분석(Transcriptomics)을 통한 발달 경로 규명'
  - chapter_id: ch06
    chapter_number: 6
    title: 제6장. 재배 환경에 따른 생산성 및 품질 최적화
    target_pages: 50
    summary_ko: 생육 과정 중 나타날 수 있는 생산성 저해 요인(기형근)을 분석하고, 각 생육 단계별로 품질 목표(당도 vs. 전분)에 맞는 최적의 재배 조건을 설계하는 방법론을 제시합니다.
    sections:
    - 6.1 기형근(Deformed Root) 발생 원인 분석 및 예방
    - 6.2 수확량 극대화를 위한 생육 주기 관리 (생육 기간 조절)
    - '6.3 품질 결정 인자: 당도, 전분 함량 및 색상(품종별)'
    - 6.4 생육 단계별 영양소 요구도 및 시비 전략 재검토
