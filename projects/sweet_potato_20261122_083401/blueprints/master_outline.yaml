book_metadata:
  title_ko: 고구마 재배
  title_en: Sweet potato
  target_audience: 대학 전공 심화, 대학원생, 연구자 및 선도 현장 실무자
  book_summary_ko: 본 교재는 고구마 재배에 대한 기초 농업 지식을 넘어, 괴근 발달의 분자생물학적 기작부터 최첨단 환경 제어 기술까지 통합적으로 다루는 심화 전문서입니다. 초기 환경 조성부터 생육 중의 생리적 조절, 병해 관리, 그리고 수확
    후 품질 유지에 이르는 전 과정을 과학적으로 분석합니다. 연구자와 현장 최고 전문가를 위한 이론과 실무의 경계 해소를 목표로 합니다.
