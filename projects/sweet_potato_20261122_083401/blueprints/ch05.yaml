chapter_id: ch05
chapter_number: 5
title: 제5장. 괴근 형성 및 비대 과정의 분자생물학적 이해
target_pages: 50
summary_ko: 괴근이 형성되고 비대해지는 과정에 관여하는 생화학적, 분자생물학적 메커니즘을 최신 연구를 기반으로 설명합니다. 특히 당분 저장 및 효소 작용에 초점을 맞춥니다.
sections:
- 5.1 괴근 형성 유도 요인과 발달 시기
- 5.2 괴근 비대(Tuberous Root Enlargement)를 조절하는 호르몬 및 유전자
- '5.3 당분 축적 메커니즘: 전분 및 당화 효소 연구 (Isoamylase 등)'
- '5.4 최신 연구 동향: 전사체 분석(Transcriptomics)을 통한 발달 경로 규명'
